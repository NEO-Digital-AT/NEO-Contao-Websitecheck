# NEO Website Check — Dutch texts (front end, report, e-mail).
# Copy to translations/neo_websitecheck.nl.yaml in your project to override single keys.
word:
    yes: 'ja'
    no: 'nee'
    none: 'geen'
grade:
    1: 'Zeer goed'
    2: 'Goed'
    3: 'Ruim voldoende'
    4: 'Voldoende'
    5: 'Onvoldoende'
verdict:
    good: 'Een degelijke website. Niets dringends; een paar kleine dingen maken hem nog beter.'
    mid: 'Een goede basis, maar enkele punten kosten u waarschijnlijk aanvragen. De belangrijkste staan hieronder.'
    low: 'Duidelijk werk aan de winkel. Begin met de drie maatregelen hieronder; dan wordt de website een middel dat klanten oplevert.'
area:
    speed: 'Laadsnelheid'
    accessibility: 'Toegankelijkheid'
    seo: 'Vindbaarheid in Google'
    ai: 'Zichtbaarheid in AI-zoekmachines'
    content: 'Inhoud & duidelijkheid'
    legal: 'Juridisch & privacy'
    mobile: 'Mobiel'
    unavailable: 'Kon deze keer niet worden gemeten.'
measure:
    effort:
        small: 'weinig werk'
        medium: 'gemiddeld werk'
        large: 'veel werk'

# ---------------------------------------------------------------- speed
speed:
    summary:
        good: 'De startpagina is op een smartphone na %lcp% s zichtbaar. Dat is sneller dan bij de meeste websites.'
        ok: 'De startpagina heeft op een smartphone %lcp% s nodig. Bruikbaar, maar een deel van de bezoekers haakt af voordat hij klaar is.'
        bad: 'De startpagina heeft op een smartphone %lcp% s nodig. Veel bezoekers zijn al weg voordat er iets verschijnt.'
    meta: 'Performance %perf% van 100 · LCP %lcp% s · CLS %cls%'
    kpi:
        lcp: 'Hoofdinhoud zichtbaar (LCP)'
        lcp_note: 'grens 2,5 s'
        cls: 'Verspringende lay-out (CLS)'
        cls_note: 'grens 0,1'
        tbt: 'Geblokkeerde tijd (TBT)'
        tbt_note: 'grens 200 ms'
        inp: 'Reactie op tikken (INP)'
        inp_note: 'grens 200 ms'
        perf: 'Performancescore'
        perf_note: 'van 100'
        bytes: 'Paginagewicht'
        bytes_note: 'grens 2 MB'
        requests: 'Verzoeken'
        requests_note: 'grens 80'
    issue:
        lcp:
            title: 'Startpagina laadt traag op smartphones'
            text: 'De hoofdinhoud verschijnt na %lcp% seconden. Google legt de grens bij 2,5 seconden; bezoekers oordelen nog eerder.'
            fix: 'Verklein de grootste afbeelding in het eerste scherm, laad scripts later en laat de server gecomprimeerde bestanden versturen. Meestal één tot twee uur werk.'
        largest_image:
            title: 'Eén afbeelding weegt %kb% KB'
            text: 'Het bestand “%file%” is het zwaarste onderdeel van de startpagina en vertraagt alles wat erna komt.'
            fix: 'Exporteer de afbeelding op de weergegeven breedte (meestal 1200–1600 px) als WebP of AVIF. Vaak 80 % kleiner zonder zichtbaar verschil.'
        render_blocking:
            title: '%count% bestanden blokkeren de eerste weergave'
            text: 'Stylesheets of scripts in de kop van de pagina worden volledig geladen voordat er iets wordt getoond.'
            fix: 'Laad niet-kritieke CSS en JavaScript uitgesteld of asynchroon; houd alleen de kritieke stijlen in de kop.'
        image_formats:
            title: 'Afbeeldingen in verouderde formaten'
            text: 'JPEG/PNG waar WebP of AVIF 30–70 % kleiner zou zijn.'
            fix: 'Laat het CMS automatisch moderne formaten leveren (bij de meeste systemen is dat één instelling).'
        responsive_images:
            title: 'Afbeeldingen groter dan weergegeven'
            text: 'Smartphones downloaden afbeeldingen op desktopformaat en verkleinen ze daarna.'
            fix: 'Lever afbeeldingen in meerdere formaten (srcset); het CMS kan ze meestal zelf aanmaken.'
        unused_js:
            title: 'Ongebruikt JavaScript'
            text: 'Er worden scripts geladen die deze pagina niet gebruikt. Dat kost tijd en batterij.'
            fix: 'Verwijder ongebruikte plug-ins en trackingscripts; laad de rest alleen op de pagina’s die het nodig hebben.'
        ttfb:
            title: 'Server reageert traag'
            text: 'De server heeft %value% nodig om de eerste byte te leveren, voordat de browser iets kan doen.'
            fix: 'Schakel paginacaching in het CMS in of vraag de hostingprovider om een sneller pakket.'
        compression:
            title: 'Bestanden worden ongecomprimeerd verstuurd'
            text: 'Tekstbestanden (HTML, CSS, JavaScript) worden op weg naar de browser niet gecomprimeerd.'
            fix: 'Schakel gzip- of Brotli-compressie in op de server (één regel in de serverconfiguratie).'
        cls:
            title: 'Inhoud verspringt tijdens het laden (CLS %cls%)'
            text: 'Elementen verschuiven nadat ze verschenen zijn, waardoor bezoekers op het verkeerde klikken of de draad kwijtraken.'
            fix: 'Reserveer ruimte voor afbeeldingen, advertenties en lettertypen (width/height-attributen, font-display: swap).'
        bytes:
            title: 'Startpagina weegt %mb% MB'
            text: 'Via een mobiele verbinding duurt dat enkele seconden en het kost databundel.'
            fix: 'Comprimeer afbeeldingen en video’s; laad video’s pas als ze in beeld komen.'
        console:
            title: '%count% fouten in de browserconsole'
            text: 'JavaScript-fouten wijzen op kapotte functies waar bezoekers tegenaan kunnen lopen.'
            fix: 'Laat de fouten door de webontwikkelaar nakijken; meestal gaat het om verouderde plug-ins.'
    good:
        lcp:
            title: 'Snel op smartphones'
            text: 'De hoofdinhoud is na %lcp% s zichtbaar — onder de 2,5 s die Google verwacht. Die basis ontbreekt bij veel websites.'
        cls:
            title: 'Niets verspringt'
            text: 'De lay-out blijft stabiel tijdens het laden; bezoekers kunnen meteen lezen en klikken.'
        https:
            title: 'HTTPS correct ingericht'
            text: 'Versleutelde verbinding met een geldig certificaat; gewoon http wordt doorgestuurd naar https.'
        console:
            title: 'Geen fouten in de browser'
            text: 'De browserconsole is schoon — geen kapotte scripts.'
        images:
            title: 'Afbeeldingen correct geleverd'
            text: 'Moderne formaten en passende afmetingen voor smartphone en desktop.'

# ---------------------------------------------------------------- accessibility
a11y:
    summary:
        good: 'Toegankelijk volgens de automatische tests: teksten zijn leesbaar, bedieningselementen hebben een naam.'
        ok: 'Grotendeels in orde. %count% contrastbevindingen en een paar ontbrekende labels staan een topcijfer in de weg.'
        bad: 'Meerdere drempels: %count% contrastbevindingen, ontbrekende labels of beschrijvingen. Ook gewone bezoekers hebben daar last van.'
    meta: 'Lighthouse-toegankelijkheid %score% van 100 · %count% contrastbevindingen'
    issue:
        meta_viewport:
            title: 'Inzoomen is op smartphones geblokkeerd'
            text: 'De pagina verhindert inzoomen met twee vingers. Slechtziende mensen kunnen de tekst niet vergroten.'
            fix: 'Verwijder user-scalable=no en maximum-scale uit de viewport-tag in de kop van de pagina; één regel in de template.'
        color_contrast:
            title: 'Tekst met te weinig contrast (%count%×)'
            text: 'Lichte tekst op een lichte achtergrond of donker op donker is in zonlicht slecht leesbaar, en ook voor ongeveer één op de twaalf mannen (kleurenzien). Vereist: 4,5:1.'
            fix: 'Maak de tekstkleur of de achtergrond iets donkerder — meestal één kleurwaarde in de stylesheet, geen nieuw ontwerp.'
        image_alt:
            title: '%count% afbeeldingen zonder beschrijving'
            text: 'Schermlezers en Google weten niet wat deze afbeeldingen tonen.'
            fix: 'Geef elke inhoudelijke afbeelding een korte alt-tekst; decoratieve afbeeldingen krijgen een leeg alt-attribuut.'
        link_name:
            title: '%count% links zonder leesbare naam'
            text: 'Links als “lees meer” of links met alleen een pictogram zeggen gebruikers van schermlezers niets.'
            fix: 'Geef elke link een tekst die zegt waar hij naartoe leidt, of een aria-label bij pictogramlinks.'
        button_name:
            title: '%count% knoppen zonder naam'
            text: 'Pictogramknoppen zonder label kunnen gebruikers van schermlezers niet bedienen.'
            fix: 'Geef elke pictogramknop een aria-label (bijv. “Menu openen”).'
        html_has_lang:
            title: 'Taal van de pagina niet opgegeven'
            text: 'Zonder taalattribuut kiezen schermlezers de verkeerde uitspraak.'
            fix: 'Zet lang="nl" (of uw taal) op het <html>-element.'
        heading_order:
            title: 'Koppen slaan niveaus over'
            text: 'Kopniveaus worden overgeslagen (h1 → h3), waardoor de structuur voor hulpmiddelen verwarrend is.'
            fix: 'Gebruik de kopniveaus op volgorde; bepaal het uiterlijk met CSS in plaats van een niveau te kiezen om hoe het eruitziet.'
        label:
            title: '%count% formuliervelden zonder label'
            text: 'Velden zonder zichtbaar, gekoppeld label zijn lastig in te vullen en worden door het automatisch invullen van browsers overgeslagen.'
            fix: 'Geef elk veld een <label for> dat overeenkomt met de id van het veld.'
        target_size:
            title: '%count% aanraakdoelen te klein'
            text: 'Links of knoppen kleiner dan 24 px mis je makkelijk met je duim.'
            fix: 'Vergroot het klikbare vlak (padding) tot minstens 44 × 44 px.'
        label_content_name_mismatch:
            title: '%count% bedieningselementen waarvan de uitgesproken naam afwijkt van het label'
            text: 'Pictogramknoppen (zoeken, pijlen, bellen) hebben een toegankelijke naam die niet overeenkomt met de zichtbare tekst, waardoor spraakbesturing en schermlezers iets anders aankondigen.'
            fix: 'Laat het aria-label met de zichtbare tekst beginnen, of gebruik de tekst van het pictogram als naam.'
    good:
        contrast:
            title: 'Contrasten in orde'
            text: 'Elke gecontroleerde tekst haalt de vereiste contrastverhouding.'
        images:
            title: 'Afbeeldingen zijn beschreven'
            text: 'Alle %count% afbeeldingen op de gecontroleerde pagina’s hebben een alternatieve tekst.'
        lang:
            title: 'Taal opgegeven'
            text: 'Schermlezers lezen de pagina voor in de juiste taal.'
        names:
            title: 'Links en knoppen hebben een naam'
            text: 'Elk bedieningselement heeft een leesbare naam; de kopniveaus kloppen.'
        targets:
            title: 'Aanraakdoelen groot genoeg'
            text: 'Knoppen en links zijn goed met de duim te raken.'

# ---------------------------------------------------------------- seo
seo:
    summary:
        good: 'Titels, beschrijvingen, koppen en gestructureerde gegevens zijn in orde. Google kan de website goed lezen.'
        ok: 'De basis staat; een paar titels, beschrijvingen of structuurdetails zijn het opruimen waard.'
        bad: 'Belangrijke basiszaken voor Google ontbreken. Zoekmachines vinden de website wel, maar weten nauwelijks waar hij over gaat.'
    meta: 'Lighthouse-SEO %score% van 100 · %pages% pagina’s gecontroleerd'
    issue:
        title_missing:
            title: 'Geen paginatitel op %page%'
            text: 'De titel is de kop in de zoekresultaten van Google. Zonder titel verzint Google er zelf een.'
            fix: 'Schrijf een titel van maximaal 60 tekens: wat u aanbiedt en waar (bijv. “Tandarts in Utrecht – Dr. Voorbeeld”).'
        title_long:
            title: 'Paginatitel te lang op %page%'
            text: '%length% tekens — Google kort titels af na ongeveer 60.'
            fix: 'Maak de titel korter; de belangrijkste woorden vooraan.'
        desc_missing:
            title: 'Geen beschrijving op %page%'
            text: 'De metabeschrijving is de grijze tekst onder het zoekresultaat in Google. Ontbreekt die, dan toont Google een willekeurig fragment.'
            fix: 'Schrijf 140–158 tekens die zeggen wat de pagina biedt en waarom iemand zou moeten klikken.'
        desc_long:
            title: 'Beschrijving te lang op %page%'
            text: '%length% tekens — Google kort beschrijvingen af na ongeveer 160.'
            fix: 'Inkorten tot 140–158 tekens.'
        h1_missing:
            title: 'Geen hoofdkop op %page%'
            text: 'Elke pagina heeft precies één H1 nodig die het onderwerp noemt.'
            fix: 'Maak van de belangrijkste kop een H1.'
        h1_multiple:
            title: '%count% hoofdkoppen op %page%'
            text: 'Meerdere H1-koppen maken onduidelijk waar de pagina over gaat.'
            fix: 'Houd één H1 per pagina aan; maak van de andere een H2.'
        noindex:
            title: 'Startpagina geblokkeerd voor Google'
            text: 'De startpagina heeft een “noindex”-instructie: Google krijgt te horen dat hij haar niet moet opnemen.'
            fix: 'Verwijder de noindex-instelling in het CMS (meestal een vinkje bij de pagina).'
        heading_skips:
            title: 'Kopniveaus overgeslagen (%count%×)'
            text: 'Sprongen als H1 → H3 maken de structuur onduidelijk voor Google en schermlezers.'
            fix: 'Gebruik de kopniveaus op volgorde.'
        sitemap_missing:
            title: 'Geen sitemap gevonden'
            text: 'Een sitemap.xml geeft Google in één keer alle pagina’s door; zonder sitemap worden nieuwe pagina’s later gevonden.'
            fix: 'Schakel de sitemap in het CMS in en verwijs ernaar in robots.txt.'
        schema:
            title: 'Geen gestructureerde gegevens'
            text: 'Gestructureerde gegevens (schema.org) vertellen Google en AI-assistenten wat voor bedrijf dit is, waar het zit en wanneer het open is.'
            fix: 'Voeg Organization- of LocalBusiness-gegevens toe met naam, adres, telefoon en openingstijden (voor de meeste CMS bestaat een plug-in).'
        not_crawlable:
            title: 'Pagina geblokkeerd voor zoekmachines'
            text: 'Robots-instructies verhinderen dat Google de pagina opneemt.'
            fix: 'Controleer robots.txt en de robots-metatag; hef de blokkade voor de openbare pagina’s op.'
        link_text:
            title: '%count% links met nietszeggende tekst'
            text: '“Klik hier” of “meer” vertelt Google niets over de doelpagina.'
            fix: 'Gebruik beschrijvende linkteksten (“onze openingstijden”).'
        crawlable_anchors:
            title: 'Links die Google niet kan volgen'
            text: 'Sommige links zijn alleen met JavaScript gebouwd en zijn onzichtbaar voor zoekmachines.'
            fix: 'Gebruik gewone <a href>-links voor de navigatie.'
        canonical:
            title: 'Canonieke link onjuist'
            text: 'De canonical-tag verwijst naar een verkeerd of onbereikbaar adres, wat Google in verwarring kan brengen.'
            fix: 'Laat de canonieke link naar de pagina zelf verwijzen.'
        hreflang:
            title: 'Taallinks onjuist'
            text: 'De hreflang-tags voor de taalversies bevatten fouten.'
            fix: 'Laat de hreflang-tags corrigeren (geldige taalcodes, alle versies verwijzen naar elkaar).'
        http_redirect:
            title: 'http stuurt niet door naar https'
            text: 'Bezoekers die het adres zonder https intypen, komen op de onversleutelde versie terecht.'
            fix: 'Stel op de server een permanente doorverwijzing van http naar https in.'
    good:
        sitemap:
            title: 'Sitemap aanwezig'
            text: '%count% pagina’s staan voor Google klaar.'
        titles:
            title: 'Titels en beschrijvingen ingesteld'
            text: 'Elke gecontroleerde pagina heeft een eigen titel en beschrijving van geschikte lengte.'
        h1:
            title: 'Eén hoofdkop per pagina'
            text: 'Duidelijke structuur voor Google en bezoekers.'
        schema:
            title: 'Gestructureerde gegevens aanwezig'
            text: 'Google en AI-assistenten vinden gegevens van het type %types%.'
        https:
            title: 'Versleuteld en doorgestuurd'
            text: 'https met doorverwijzing vanaf http.'

# ---------------------------------------------------------------- AI visibility
ai:
    summary:
        good: 'AI-assistenten kunnen de website lezen en begrijpen; er is een samenvatting (llms.txt).'
        ok: 'AI-assistenten mogen de website lezen, maar moeten zelf bij elkaar puzzelen wat u aanbiedt.'
        bad: 'AI-zoekmachines zien de website nauwelijks: geen samenvatting, crawlers geblokkeerd of geen herkenbare bedrijfsgegevens.'
    meta: 'llms.txt: %llms% · %blocked% AI-crawlers geblokkeerd'
    issue:
        llms_missing:
            title: 'Geen llms.txt'
            text: 'ChatGPT, Perplexity en de AI van Google zoeken naar een kort tekstbestand dat zegt wat het bedrijf doet, voor wie en waar. Zonder dat bestand raden ze het aan de hand van de pagina’s.'
            fix: 'Maak /llms.txt aan: drie alinea’s (aanbod, doelgroep, locatie/contact) plus links naar de belangrijkste pagina’s. Een halfuurtje werk.'
        bots_blocked:
            title: 'AI-crawlers geblokkeerd: %bots%'
            text: 'robots.txt verbiedt deze assistenten de website te lezen, dus kunnen ze hem ook niet aanbevelen.'
            fix: 'Sta de crawlers toe in robots.txt — of kies bewust ervoor om niet in AI-antwoorden voor te komen.'
        no_identity_schema:
            title: 'Bedrijf niet machineleesbaar'
            text: 'Zonder Organization/LocalBusiness-gegevens kent een assistent naam, adres of openingstijden niet betrouwbaar.'
            fix: 'Voeg gestructureerde gegevens toe met naam, adres, telefoon, openingstijden en werkgebied.'
        offer_unclear:
            title: 'Aanbod niet in de eerste zinnen'
            text: 'AI-antwoorden citeren de eerste zinnen van een pagina. Op de startpagina noemen die het aanbod niet duidelijk.'
            fix: 'Begin de pagina met één eenvoudige zin: wie u bent, wat u doet, voor wie en waar.'
    good:
        llms:
            title: 'llms.txt aanwezig'
            text: 'AI-assistenten krijgen een samenvatting rechtstreeks van u.'
        bots:
            title: 'AI-crawlers toegestaan'
            text: 'GPTBot, ClaudeBot, PerplexityBot en Google-Extended mogen de website lezen.'
        schema:
            title: 'Bedrijf machineleesbaar'
            text: 'Gestructureerde gegevens van het type %types% maken het bedrijf herkenbaar.'
        offer:
            title: 'Aanbod vroeg genoemd'
            text: 'De eerste zinnen zeggen al wat het bedrijf doet.'

# ---------------------------------------------------------------- content
content:
    summary:
        good: 'Binnen vijf seconden is duidelijk wat het bedrijf doet, voor wie en wat de volgende stap is.'
        ok: 'Begrijpelijk, maar het aanbod of de volgende stap kan duidelijker; sommige begrippen veronderstellen voorkennis.'
        bad: 'Bezoekers begrijpen niet snel wat er wordt aangeboden of hoe ze contact opnemen. Dat kost aanvragen.'
    meta:
        ai: 'AI heeft %pages% pagina’s gelezen zoals een nieuwe bezoeker'
        heuristic: 'Controle op basis van vuistregels (geen AI ingesteld)'
    issue:
        no_cta:
            title: 'Geen duidelijke volgende stap'
            text: 'Geïnteresseerde bezoekers zien niet in één oogopslag hoe ze kunnen bellen, iets aanvragen of boeken.'
            fix: 'Zet één opvallende actie in het eerste scherm: “Bellen”, “Offerte aanvragen” of “Boeken” — met telefoonnummer.'
        thin:
            title: 'Heel weinig tekst (%words% woorden)'
            text: 'Met zo weinig tekst komen bezoekers en Google niet te weten wat u aanbiedt.'
            fix: 'Beschrijf aanbod, doelgroep en locatie in twee of drie korte alinea’s.'
        phone:
            title: 'Telefoonnummer niet aantikbaar'
            text: 'Op een smartphone hoort een nummer aantikbaar te zijn (tel:-link). Hier ontbreekt het of staat het als gewone tekst.'
            fix: 'Link het telefoonnummer met tel:+31…; zet het in de kop- of voettekst van elke pagina.'
    good:
        cta:
            title: 'Duidelijke volgende stap'
            text: 'Bezoekers zien hoe ze contact kunnen opnemen.'
        length:
            title: 'Genoeg tekst'
            text: '%words% woorden beschrijven het aanbod.'
        phone:
            title: 'Telefoonnummer aantikbaar'
            text: 'Eén tik op de smartphone en het gesprek begint.'

# ---------------------------------------------------------------- legal
legal:
    summary:
        good: 'Colofon, privacyverklaring en toestemmingsbeheer zijn aanwezig, voor zover technisch te controleren.'
        ok: 'Colofon en privacyverklaring zijn aanwezig; de omgang met diensten van derden verdient een controle.'
        bad: 'Colofon of privacyverklaring ontbreekt, of trackingdiensten laden vóór de toestemming. Laat dit nakijken door uw juridisch adviseur.'
    meta: 'Technische controle, geen juridisch advies'
    note: 'Dit is een technische controle: er wordt gezocht naar de pagina’s en naar diensten die al vóór enige toestemming laden. Het is geen juridisch advies — laat de details nakijken door uw juridisch adviseur.'
    issue:
        imprint:
            title: 'Colofon (bedrijfsgegevens) niet gevonden'
            text: 'Op de gecontroleerde pagina’s is geen link naar een colofon met bedrijfsgegevens gevonden, of de pagina is niet bereikbaar.'
            fix: 'Link vanaf elke pagina (voettekst) naar een colofon met de verplichte bedrijfsgegevens.'
        privacy:
            title: 'Privacyverklaring niet gevonden'
            text: 'Er is geen link naar een privacyverklaring gevonden, of de pagina is niet bereikbaar.'
            fix: 'Link vanaf elke pagina (voettekst) naar de privacyverklaring; daarin moet elke gebruikte dienst genoemd worden.'
        tracking:
            title: 'Tracking vóór toestemming: %services%'
            text: 'Deze diensten laden bij het eerste bezoek, voordat de bezoeker toestemming kon geven. Volgens de AVG en de cookieregels is daarvoor vooraf toestemming nodig.'
            fix: 'Laad deze diensten pas na toestemming in de cookiebanner (of stel de toestemmingstool zo in dat hij ze blokkeert).'
        embeds:
            title: 'Diensten van derden zonder toestemmingstool: %services%'
            text: 'Externe diensten laden zonder cookiebanner. Afhankelijk van de dienst kan toestemming vereist zijn.'
            fix: 'Host lettertypen lokaal; laad kaarten en video’s pas na een klik of via de toestemmingstool.'
    good:
        imprint:
            title: 'Colofon aanwezig'
            text: 'Gelinkt en bereikbaar.'
        privacy:
            title: 'Privacyverklaring aanwezig'
            text: 'Gelinkt en bereikbaar.'
        no_third_party:
            title: 'Geen diensten van derden vóór toestemming'
            text: 'Bij het eerste bezoek laadt er niets van buitenaf.'
        cmp:
            title: 'Toestemmingstool aanwezig'
            text: 'Er is een cookiebanner / toestemmingstool gevonden.'

# ---------------------------------------------------------------- mobile
mobile:
    summary:
        good: 'Past op het scherm van een smartphone; knoppen en tekst zijn groot genoeg.'
        ok: 'Bruikbaar op smartphones; enkele aanraakdoelen of lettergroottes zijn te klein.'
        bad: 'Lastig te gebruiken op smartphones: geen viewport-instelling, te kleine aanraakdoelen of inhoud die breder is dan het scherm.'
        unknown: 'Kon niet volledig worden gemeten (geen PageSpeed-resultaat).'
    meta: 'Viewport, aanraakdoelen, lettergrootte, breedte van de inhoud'
    issue:
        viewport:
            title: 'Geen mobiele viewport'
            text: 'De pagina wordt op smartphones getoond als verkleinde desktoppagina.'
            fix: 'Voeg <meta name="viewport" content="width=device-width, initial-scale=1"> toe aan de kop van de pagina.'
        targets:
            title: '%count% aanraakdoelen te klein'
            text: 'Links of knoppen zijn te klein of staan te dicht op elkaar voor een duim.'
            fix: 'Vergroot het aanraakvlak tot minstens 44 × 44 px en zorg voor ruimte tussen links.'
        font:
            title: 'Tekst te klein op smartphones'
            text: '%value% van de tekst is kleiner dan 12 px en slecht leesbaar op smartphones.'
            fix: 'Gebruik minstens 16 px voor lopende tekst.'
        width:
            title: 'Inhoud breder dan het scherm'
