# NEO Website Check — Czech texts (front end, report, e-mail).
# Copy to translations/neo_websitecheck.cs.yaml in your project to override single keys.
word:
    yes: 'ano'
    no: 'ne'
    none: 'žádné'
grade:
    1: 'Velmi dobré'
    2: 'Dobré'
    3: 'Uspokojivé'
    4: 'Dostatečné'
    5: 'Nedostatečné'
verdict:
    good: 'Solidní web. Nic naléhavého, pár drobností by ho ještě vylepšilo.'
    mid: 'Dobrý základ, ale některé body vás nejspíš stojí poptávky. Ty nejdůležitější najdete níže.'
    low: 'Jasná potřeba jednat. Začněte třemi opatřeními níže – pak se z webu stane nástroj, který přivádí zákazníky.'
area:
    speed: 'Rychlost načítání'
    accessibility: 'Přístupnost'
    seo: 'Dohledatelnost na Googlu'
    ai: 'Viditelnost ve vyhledávání s AI'
    content: 'Obsah a srozumitelnost'
    legal: 'Právní náležitosti a ochrana údajů'
    mobile: 'Mobilní zobrazení'
    unavailable: 'Tentokrát se nepodařilo změřit.'
measure:
    effort:
        small: 'malá náročnost'
        medium: 'střední náročnost'
        large: 'velká náročnost'

# ---------------------------------------------------------------- speed
speed:
    summary:
        good: 'Úvodní stránka je na mobilu vidět po %lcp% s. To je rychleji než u většiny webů.'
        ok: 'Úvodní stránka se na mobilu načítá %lcp% s. Dá se použít, ale část návštěvníků odejde dřív, než je hotová.'
        bad: 'Úvodní stránka potřebuje na mobilu %lcp% s. Mnoho návštěvníků odejde dřív, než se cokoli objeví.'
    meta: 'Výkon %perf% ze 100 · LCP %lcp% s · CLS %cls%'
    kpi:
        lcp: 'Hlavní obsah viditelný (LCP)'
        lcp_note: 'limit 2,5 s'
        cls: 'Posuny rozvržení (CLS)'
        cls_note: 'limit 0,1'
        tbt: 'Doba blokování (TBT)'
        tbt_note: 'limit 200 ms'
        inp: 'Reakce na klepnutí (INP)'
        inp_note: 'limit 200 ms'
        perf: 'Skóre výkonu'
        perf_note: 'ze 100'
        bytes: 'Velikost stránky'
        bytes_note: 'limit 2 MB'
        requests: 'Požadavky'
        requests_note: 'limit 80'
    issue:
        lcp:
            title: 'Úvodní stránka se na mobilu načítá pomalu'
            text: 'Hlavní obsah se objeví po %lcp% sekundách. Google stanovuje hranici 2,5 sekundy; návštěvníci soudí ještě dřív.'
            fix: 'Zmenšete největší obrázek v horní části stránky, načítejte skripty později a nechte server posílat komprimované soubory. Obvykle jedna až dvě hodiny práce.'
        largest_image:
            title: 'Jeden obrázek má %kb% KB'
            text: 'Soubor „%file%“ je nejtěžším prvkem úvodní stránky a zdržuje vše, co následuje.'
            fix: 'Exportujte obrázek v zobrazované šířce (obvykle 1200–1600 px) jako WebP nebo AVIF. Často o 80 % menší bez viditelného rozdílu.'
        render_blocking:
            title: '%count% souborů blokuje první zobrazení'
            text: 'Styly nebo skripty v hlavičce stránky se načtou celé dřív, než se cokoli zobrazí.'
            fix: 'Méně důležité CSS a JavaScript načítejte odloženě nebo asynchronně; v hlavičce ponechte jen nezbytné styly.'
        image_formats:
            title: 'Obrázky ve starých formátech'
            text: 'JPEG/PNG tam, kde by WebP nebo AVIF byly o 30–70 % menší.'
            fix: 'Nechte redakční systém (CMS) automaticky dodávat moderní formáty (většina systémů to umí jedním nastavením).'
        responsive_images:
            title: 'Obrázky větší, než jak se zobrazují'
            text: 'Mobily stahují obrázky ve velikosti pro počítač a zmenšují si je.'
            fix: 'Připravte obrázky v několika velikostech (srcset); CMS je obvykle umí vytvořit samo.'
        unused_js:
            title: 'Nevyužitý JavaScript'
            text: 'Načítají se skripty, které tato stránka nepoužívá. Stojí čas i baterii.'
            fix: 'Odstraňte nepoužívané pluginy a měřicí skripty; zbytek načítejte jen na stránkách, které ho potřebují.'
        ttfb:
            title: 'Server odpovídá pomalu'
            text: 'Serveru trvá %value%, než pošle první bajt – teprve potom může prohlížeč cokoli dělat.'
            fix: 'Zapněte v CMS ukládání stránek do mezipaměti nebo požádejte poskytovatele hostingu o rychlejší tarif.'
        compression:
            title: 'Soubory se posílají nekomprimované'
            text: 'Textové soubory (HTML, CSS, JavaScript) se na cestě do prohlížeče nekomprimují.'
            fix: 'Zapněte na serveru kompresi gzip nebo Brotli (jeden řádek v konfiguraci serveru).'
        cls:
            title: 'Obsah při načítání poskakuje (CLS %cls%)'
            text: 'Prvky se po zobrazení posouvají, takže návštěvníci kliknou na něco jiného nebo ztratí místo, kde četli.'
            fix: 'Rezervujte místo pro obrázky, reklamy a písma (atributy width/height, font-display: swap).'
        bytes:
            title: 'Úvodní stránka má %mb% MB'
            text: 'Na mobilním připojení to trvá několik sekund a spotřebovává data.'
            fix: 'Komprimujte obrázky a videa; videa načítejte, až když jsou vidět.'
        console:
            title: '%count% chyb v konzoli prohlížeče'
            text: 'Chyby JavaScriptu ukazují na nefunkční prvky, na které mohou návštěvníci narazit.'
            fix: 'Nechte chyby prověřit webovým vývojářem; obvykle jde o zastaralé pluginy.'
    good:
        lcp:
            title: 'Rychlé na mobilu'
            text: 'Hlavní obsah je vidět po %lcp% s — pod hranicí 2,5 s, kterou očekává Google. To je základ, který mnoha webům chybí.'
        cls:
            title: 'Nic neposkakuje'
            text: 'Rozvržení zůstává při načítání stabilní; návštěvníci mohou hned číst a klikat.'
        https:
            title: 'HTTPS správně nastavené'
            text: 'Šifrované spojení s platným certifikátem; prosté http přesměrovává na https.'
        console:
            title: 'Žádné chyby v prohlížeči'
            text: 'Konzole prohlížeče je čistá — žádné nefunkční skripty.'
        images:
            title: 'Obrázky dodávané správně'
            text: 'Moderní formáty a vhodné velikosti pro mobil i počítač.'

# ---------------------------------------------------------------- accessibility
a11y:
    summary:
        good: 'V automatických testech bez bariér: texty jsou čitelné, ovládací prvky mají popisky.'
        ok: 'Většinou v pořádku. %count% nálezů v kontrastu a několik popisků brání nejlepší známce.'
        bad: 'Několik bariér: %count% nálezů v kontrastu, chybějící popisky nebo popisy. Ty komplikují i běžné návštěvníky.'
    meta: 'Lighthouse přístupnost %score% ze 100 · %count% nálezů v kontrastu'
    issue:
        meta_viewport:
            title: 'Přiblížení je na mobilu zablokované'
            text: 'Stránka brání přiblížení dvěma prsty. Lidé se slabším zrakem si nemohou text zvětšit.'
            fix: 'Odstraňte user-scalable=no a maximum-scale ze značky viewport v hlavičce stránky – jeden řádek v šabloně.'
        color_contrast:
            title: 'Text s příliš nízkým kontrastem (%count%×)'
            text: 'Světlý text na světlém pozadí nebo tmavý na tmavém se na slunci špatně čte, stejně jako zhruba pro každého dvanáctého muže (porucha barevného vidění). Požadováno: 4,5:1.'
            fix: 'Barvu textu nebo pozadí mírně ztmavte či zesvětlete — obvykle jedna hodnota barvy ve stylech, žádný redesign.'
        image_alt:
            title: '%count% obrázků bez popisu'
            text: 'Čtečky obrazovky ani Google nevědí, co tyto obrázky zobrazují.'
            fix: 'Doplňte ke každému obsahovému obrázku krátký alternativní text (alt); dekorativní obrázky dostanou prázdný atribut alt.'
        link_name:
            title: '%count% odkazů bez srozumitelného názvu'
            text: 'Odkazy jako „více“ nebo odkazy jen s ikonou nic neříkají uživatelům čteček obrazovky.'
            fix: 'Dejte každému odkazu text, který říká, kam vede, u odkazů s ikonou aria-label.'
        button_name:
            title: '%count% tlačítek bez názvu'
            text: 'Tlačítka s ikonou bez popisku nemohou uživatelé čteček obrazovky ovládat.'
            fix: 'Doplňte ke každému tlačítku s ikonou aria-label (např. „Otevřít menu“).'
        html_has_lang:
            title: 'Jazyk stránky není uveden'
            text: 'Bez atributu jazyka zvolí čtečky obrazovky špatnou výslovnost.'
            fix: 'Nastavte u prvku <html> atribut lang="cs" (nebo kód vašeho jazyka).'
        heading_order:
            title: 'Nadpisy přeskakují úrovně'
            text: 'Úrovně nadpisů se přeskakují (h1 → h3), takže struktura je pro asistivní technologie matoucí.'
            fix: 'Používejte úrovně nadpisů postupně; vzhled upravte v CSS, místo abyste úroveň volili podle vzhledu.'
        label:
            title: '%count% polí formuláře bez popisku'
            text: 'Pole bez viditelného, propojeného popisku se špatně vyplňují a automatické vyplňování prohlížeče je odmítá.'
            fix: 'Dejte každému poli <label for>, který odpovídá id pole.'
        target_size:
            title: '%count% příliš malých dotykových ploch'
            text: 'Odkazy nebo tlačítka menší než 24 px se palcem snadno minou.'
            fix: 'Zvětšete klikací plochu (padding) alespoň na 44 × 44 px.'
        label_content_name_mismatch:
            title: '%count% ovládacích prvků, jejichž vyslovovaný název se liší od popisku'
            text: 'Tlačítka s ikonou (hledání, šipky, volání) mají přístupný název, který neodpovídá viditelnému textu, takže hlasové ovládání a čtečky obrazovky ohlásí něco jiného.'
            fix: 'Začněte aria-label viditelným textem, nebo nechte jako název použít text ikony.'
    good:
        contrast:
            title: 'Kontrasty jsou v pořádku'
            text: 'Každý zkontrolovaný text dosahuje požadovaného kontrastního poměru.'
        images:
            title: 'Obrázky mají popis'
            text: 'Všech %count% obrázků na zkontrolovaných stránkách má alternativní text.'
        lang:
            title: 'Jazyk je uveden'
            text: 'Čtečky obrazovky čtou stránku ve správném jazyce.'
        names:
            title: 'Odkazy a tlačítka mají názvy'
            text: 'Každý ovládací prvek má srozumitelný název; úrovně nadpisů jsou v pořádku.'
        targets:
            title: 'Dostatečně velké dotykové plochy'
            text: 'Tlačítka a odkazy se dají trefit palcem.'

# ---------------------------------------------------------------- seo
seo:
    summary:
        good: 'Titulky, popisy, nadpisy a strukturovaná data jsou v pořádku. Google web dokáže přečíst.'
        ok: 'Základ je hotový; několik titulků, popisů nebo detailů struktury stojí za úpravu.'
        bad: 'Chybí důležité základy pro Google. Vyhledávače web najdou, ale skoro nevědí, o čem je.'
    meta: 'Lighthouse SEO %score% ze 100 · zkontrolováno %pages% stránek'
    issue:
        title_missing:
            title: 'Chybí titulek stránky na %page%'
            text: 'Titulek je nadpis ve výsledcích Googlu. Bez něj si Google nějaký vymyslí.'
            fix: 'Napište titulek do 60 znaků: co nabízíte a kde (např. „Zubař v Brně – MUDr. Příklad“).'
        title_long:
            title: 'Příliš dlouhý titulek stránky na %page%'
            text: '%length% znaků — Google zkracuje titulky zhruba po 60 znacích.'
            fix: 'Zkraťte titulek; nejdůležitější slova dejte na začátek.'
        desc_missing:
            title: 'Chybí popis na %page%'
            text: 'Meta popis je šedý text pod výsledkem v Googlu. Když chybí, Google zobrazí náhodný úryvek.'
            fix: 'Napište 140–158 znaků, které říkají, co stránka nabízí a proč na ni kliknout.'
        desc_long:
            title: 'Příliš dlouhý popis na %page%'
            text: '%length% znaků — Google zkracuje popisy zhruba po 160 znacích.'
            fix: 'Zkraťte na 140–158 znaků.'
        h1_missing:
            title: 'Chybí hlavní nadpis na %page%'
            text: 'Každá stránka potřebuje právě jeden nadpis H1, který pojmenuje téma.'
            fix: 'Z nejdůležitějšího nadpisu udělejte H1.'
        h1_multiple:
            title: '%count% hlavních nadpisů na %page%'
            text: 'Více nadpisů H1 zamlžuje, o čem stránka je.'
            fix: 'Ponechte na stránce jeden H1; ostatní změňte na H2.'
        noindex:
            title: 'Úvodní stránka je pro Google zablokovaná'
            text: 'Úvodní stránka obsahuje pokyn „noindex“: Google ji podle něj nemá zařadit do výsledků.'
            fix: 'Odstraňte nastavení noindex v CMS (obvykle zaškrtávací políčko u stránky).'
        heading_skips:
            title: 'Přeskočené úrovně nadpisů (%count%×)'
            text: 'Skoky jako H1 → H3 činí strukturu nejasnou pro Google i čtečky obrazovky.'
            fix: 'Používejte úrovně nadpisů postupně.'
        sitemap_missing:
            title: 'Mapa webu nenalezena'
            text: 'Soubor sitemap.xml sdělí Googlu všechny stránky najednou; bez něj se nové stránky najdou později.'
            fix: 'Zapněte mapu webu v CMS a uveďte ji v souboru robots.txt.'
        schema:
            title: 'Žádná strukturovaná data'
            text: 'Strukturovaná data (schema.org) říkají Googlu a AI asistentům, o jakou firmu jde, kde sídlí a kdy má otevřeno.'
            fix: 'Doplňte údaje Organization nebo LocalBusiness s názvem, adresou, telefonem a otevírací dobou (většina CMS na to má plugin).'
        not_crawlable:
            title: 'Stránka je pro vyhledávače zablokovaná'
            text: 'Pokyny pro roboty brání Googlu stránku indexovat.'
            fix: 'Zkontrolujte robots.txt a meta značku robots; u veřejných stránek blokaci odstraňte.'
        link_text:
            title: '%count% odkazů s nic neříkajícím textem'
            text: '„Klikněte zde“ nebo „více“ neříká Googlu nic o cílové stránce.'
            fix: 'Používejte popisné texty odkazů („naše otevírací doba“).'
        crawlable_anchors:
            title: 'Odkazy, které Google nemůže sledovat'
            text: 'Některé odkazy jsou vytvořené jen JavaScriptem a vyhledávače je nevidí.'
            fix: 'Pro navigaci používejte běžné odkazy <a href>.'
        canonical:
            title: 'Chybný kanonický odkaz'
            text: 'Značka canonical ukazuje na špatnou nebo nedostupnou adresu, což může Google zmást.'
            fix: 'Nasměrujte kanonický odkaz na stránku samotnou.'
        hreflang:
            title: 'Chybné jazykové odkazy'
            text: 'Značky hreflang pro jazykové verze obsahují chyby.'
            fix: 'Nechte značky hreflang opravit (platné kódy jazyků, všechny verze na sebe navzájem odkazují).'
        http_redirect:
            title: 'http nepřesměrovává na https'
            text: 'Návštěvníci, kteří zadají adresu bez https, skončí na nešifrované verzi.'
            fix: 'Nastavte na serveru trvalé přesměrování z http na https.'
    good:
        sitemap:
            title: 'Mapa webu existuje'
            text: 'Pro Google je uvedeno %count% stránek.'
        titles:
            title: 'Titulky a popisy jsou nastavené'
            text: 'Každá zkontrolovaná stránka má vlastní titulek a popis vhodné délky.'
        h1:
            title: 'Jeden hlavní nadpis na stránku'
            text: 'Jasná struktura pro Google i návštěvníky.'
        schema:
            title: 'Strukturovaná data existují'
            text: 'Google a AI asistenti najdou data typu %types%.'
        https:
            title: 'Šifrované a přesměrované'
            text: 'https s přesměrováním z http.'

# ---------------------------------------------------------------- AI visibility
ai:
    summary:
        good: 'AI asistenti web dokážou přečíst a pochopit; shrnutí (llms.txt) je k dispozici.'
        ok: 'AI asistenti web číst smějí, ale co nabízíte, si musí poskládat sami.'
        bad: 'Vyhledávače s AI web téměř nevidí: chybí shrnutí, roboti jsou zablokovaní nebo chybí rozpoznatelné údaje o firmě.'
    meta: 'llms.txt: %llms% · zablokovaní AI roboti: %blocked%'
    issue:
        llms_missing:
            title: 'Chybí llms.txt'
            text: 'ChatGPT, Perplexity a AI od Googlu hledají krátký textový soubor, který říká, co firma dělá, pro koho a kde. Bez něj odhadují podle stránek.'
            fix: 'Vytvořte /llms.txt: tři odstavce (nabídka, cílová skupina, místo/kontakt) a odkazy na hlavní stránky. Půl hodiny práce.'
        bots_blocked:
            title: 'Zablokovaní AI roboti: %bots%'
            text: 'Soubor robots.txt těmto asistentům zakazuje web číst, takže ho nemohou doporučit.'
            fix: 'Povolte roboty v robots.txt — nebo se vědomě rozhodněte v odpovědích AI nefigurovat.'
        no_identity_schema:
            title: 'Firma není strojově čitelná'
            text: 'Bez údajů Organization/LocalBusiness asistent spolehlivě nezná název, adresu ani otevírací dobu.'
            fix: 'Doplňte strukturovaná data s názvem, adresou, telefonem, otevírací dobou a obsluhovanou oblastí.'
        offer_unclear:
            title: 'Nabídka není v prvních větách'
            text: 'Odpovědi AI citují první věty stránky. Na úvodní stránce nabídku jasně neuvádějí.'
            fix: 'Začněte stránku jednou jednoduchou větou: kdo jste, co děláte, pro koho a kde.'
    good:
        llms:
            title: 'llms.txt existuje'
            text: 'AI asistenti dostanou shrnutí přímo od vás.'
        bots:
            title: 'AI roboti povoleni'
            text: 'GPTBot, ClaudeBot, PerplexityBot a Google-Extended smějí web číst.'
        schema:
            title: 'Firma je strojově čitelná'
            text: 'Strukturovaná data typu %types% identifikují firmu.'
        offer:
            title: 'Nabídka uvedená hned na začátku'
            text: 'Už první věty říkají, co firma dělá.'

# ---------------------------------------------------------------- content
content:
    summary:
        good: 'Do pěti sekund je jasné, co firma dělá, pro koho a jaký je další krok.'
        ok: 'Srozumitelné, ale nabídka nebo další krok by mohly být jasnější; některé pojmy předpokládají znalosti.'
        bad: 'Návštěvníci rychle nepochopí, co se nabízí ani jak se ozvat. To stojí poptávky.'
    meta:
        ai: 'AI přečetla %pages% stránek jako návštěvník, který je tu poprvé'
        heuristic: 'Heuristická kontrola (AI není nastavená)'
    issue:
        no_cta:
            title: 'Chybí jasný další krok'
            text: 'Zájemci na první pohled nevidí, jak zavolat, poptat nebo si rezervovat.'
            fix: 'Umístěte na první obrazovku jednu výraznou akci: „Zavolat“, „Poptat nabídku“ nebo „Rezervovat“ — s telefonním číslem.'
        thin:
            title: 'Velmi málo textu (%words% slov)'
            text: 'Z tak malého množství textu se ani návštěvníci, ani Google nedozvědí, co nabízíte.'
            fix: 'Popište nabídku, cílovou skupinu a místo ve dvou až třech krátkých odstavcích.'
        phone:
            title: 'Na telefonní číslo nejde klepnout'
            text: 'Na mobilu by mělo jít na číslo klepnout (odkaz tel:). Tady chybí nebo je jen prostým textem.'
            fix: 'Propojte telefonní číslo odkazem tel:+43…; umístěte ho do záhlaví nebo zápatí každé stránky.'
    good:
        cta:
            title: 'Jasný další krok'
            text: 'Návštěvníci vidí, jak se ozvat.'
        length:
            title: 'Dostatek textu'
            text: 'Nabídku popisuje %words% slov.'
        phone:
            title: 'Na telefonní číslo jde klepnout'
            text: 'Jedno klepnutí na mobilu zahájí hovor.'

# ---------------------------------------------------------------- legal
legal:
    summary:
        good: 'Údaje o provozovateli, zásady ochrany osobních údajů a práce se souhlasem jsou na místě, pokud to lze technicky ověřit.'
        ok: 'Údaje o provozovateli a zásady ochrany osobních údajů existují; zacházení se službami třetích stran je ale vhodné prověřit.'
