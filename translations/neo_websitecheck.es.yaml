# NEO Website Check — Spanish texts (front end, report, e-mail).
# Copy to translations/neo_websitecheck.es.yaml in your project to override single keys.
word:
    yes: 'sí'
    no: 'no'
    none: 'ninguno'
grade:
    1: 'Muy bien'
    2: 'Bien'
    3: 'Satisfactorio'
    4: 'Suficiente'
    5: 'Insuficiente'
verdict:
    good: 'Un sitio web sólido. Nada urgente; unos pocos detalles lo harían todavía mejor.'
    mid: 'Una base sólida, pero algunos puntos probablemente le están costando consultas. Los más importantes figuran a continuación.'
    low: 'Hay una clara necesidad de actuar. Empiece por las tres medidas siguientes y el sitio web se convertirá en una herramienta que atrae clientes.'
area:
    speed: 'Velocidad de carga'
    accessibility: 'Accesibilidad'
    seo: 'Visibilidad en Google'
    ai: 'Visibilidad en búsquedas con IA'
    content: 'Contenido y claridad'
    legal: 'Aspectos legales y privacidad'
    mobile: 'Móvil'
    unavailable: 'Esta vez no se ha podido medir.'
measure:
    effort:
        small: 'esfuerzo bajo'
        medium: 'esfuerzo medio'
        large: 'esfuerzo alto'

# ---------------------------------------------------------------- speed
speed:
    summary:
        good: 'La página de inicio se ve en el móvil a los %lcp% s. Es más rápida que la mayoría de los sitios web.'
        ok: 'La página de inicio tarda %lcp% s en el móvil. Se puede usar, pero algunos visitantes se van antes de que esté lista.'
        bad: 'La página de inicio necesita %lcp% s en el móvil. Muchos visitantes se van antes de ver nada.'
    meta: 'Rendimiento %perf% de 100 · LCP %lcp% s · CLS %cls%'
    kpi:
        lcp: 'Contenido principal visible (LCP)'
        lcp_note: 'límite 2,5 s'
        cls: 'Saltos de diseño (CLS)'
        cls_note: 'límite 0,1'
        tbt: 'Tiempo bloqueado (TBT)'
        tbt_note: 'límite 200 ms'
        inp: 'Reacción al toque (INP)'
        inp_note: 'límite 200 ms'
        perf: 'Puntuación de rendimiento'
        perf_note: 'de 100'
        bytes: 'Peso de la página'
        bytes_note: 'límite 2 MB'
        requests: 'Solicitudes'
        requests_note: 'límite 80'
    issue:
        lcp:
            title: 'La página de inicio carga lento en el móvil'
            text: 'El contenido principal aparece a los %lcp% segundos. Google pone el límite en 2,5 segundos; los visitantes juzgan incluso antes.'
            fix: 'Reduzca la imagen más grande de la parte visible, cargue los scripts más tarde y haga que el servidor envíe archivos comprimidos. Normalmente, una o dos horas de trabajo.'
        largest_image:
            title: 'Una imagen pesa %kb% KB'
            text: 'El archivo "%file%" es el elemento más pesado de la página de inicio y retrasa todo lo que viene después.'
            fix: 'Exporte la imagen al ancho con el que se muestra (normalmente 1200–1600 px) en WebP o AVIF. A menudo un 80 % más ligera sin diferencia visible.'
        render_blocking:
            title: '%count% archivos bloquean la primera visualización'
            text: 'Las hojas de estilo o los scripts de la cabecera de la página se cargan por completo antes de que se muestre nada.'
            fix: 'Cargue el CSS y el JavaScript no críticos de forma diferida o asíncrona; deje en la cabecera solo los estilos imprescindibles.'
        image_formats:
            title: 'Imágenes en formatos antiguos'
            text: 'JPEG/PNG donde WebP o AVIF serían entre un 30 y un 70 % más ligeros.'
            fix: 'Haga que el CMS entregue automáticamente formatos modernos (la mayoría de los sistemas lo hacen con un solo ajuste).'
        responsive_images:
            title: 'Imágenes más grandes de lo que se muestran'
            text: 'Los móviles descargan imágenes del tamaño de escritorio y las reducen.'
            fix: 'Ofrezca las imágenes en varios tamaños (srcset); normalmente el CMS puede generarlos.'
        unused_js:
            title: 'JavaScript sin usar'
            text: 'Se cargan scripts que esta página no utiliza. Cuestan tiempo y batería.'
            fix: 'Elimine los plugins y scripts de seguimiento que no use; cargue el resto solo en las páginas que lo necesiten.'
        ttfb:
            title: 'El servidor responde despacio'
            text: 'El servidor tarda %value% en entregar el primer byte, antes de que el navegador pueda hacer nada.'
            fix: 'Active la caché de páginas en el CMS o pida a su proveedor de alojamiento un plan más rápido.'
        compression:
            title: 'Los archivos se envían sin comprimir'
            text: 'Los archivos de texto (HTML, CSS, JavaScript) no se comprimen en su camino hacia el navegador.'
            fix: 'Active la compresión gzip o Brotli en el servidor (una línea en la configuración del servidor).'
        cls:
            title: 'El contenido salta mientras carga (CLS %cls%)'
            text: 'Los elementos se desplazan después de aparecer, así que los visitantes pulsan donde no querían o pierden el punto de lectura.'
            fix: 'Reserve espacio para imágenes, anuncios y fuentes (atributos width/height, font-display: swap).'
        bytes:
            title: 'La página de inicio pesa %mb% MB'
            text: 'Con una conexión móvil esto tarda varios segundos y consume datos.'
            fix: 'Comprima imágenes y vídeos; cargue los vídeos solo cuando sean visibles.'
        console:
            title: '%count% errores en la consola del navegador'
            text: 'Los errores de JavaScript apuntan a funciones rotas con las que los visitantes pueden toparse.'
            fix: 'Pida al desarrollador web que revise los errores; suelen deberse a plugins desactualizados.'
    good:
        lcp:
            title: 'Rápida en el móvil'
            text: 'El contenido principal es visible a los %lcp% s, por debajo de los 2,5 s que exige Google. Es la base que les falta a muchos sitios web.'
        cls:
            title: 'Nada salta'
            text: 'El diseño se mantiene estable durante la carga; los visitantes pueden leer y pulsar enseguida.'
        https:
            title: 'HTTPS bien configurado'
            text: 'Conexión cifrada con un certificado válido; http redirige a https.'
        console:
            title: 'Sin errores en el navegador'
            text: 'La consola del navegador está limpia: ningún script roto.'
        images:
            title: 'Imágenes bien entregadas'
            text: 'Formatos modernos y tamaños adecuados para móvil y escritorio.'

# ---------------------------------------------------------------- accessibility
a11y:
    summary:
        good: 'Sin barreras en las pruebas automáticas: los textos se leen bien y los controles están etiquetados.'
        ok: 'En general, bien. %count% problemas de contraste y algunas etiquetas le impiden obtener la mejor nota.'
        bad: 'Varias barreras: %count% problemas de contraste y etiquetas o descripciones que faltan. También perjudican a los visitantes habituales.'
    meta: 'Accesibilidad en Lighthouse %score% de 100 · %count% problemas de contraste'
    issue:
        meta_viewport:
            title: 'El zoom está bloqueado en el móvil'
            text: 'La página impide ampliar con dos dedos. Las personas con baja visión no pueden agrandar el texto.'
            fix: 'Quite user-scalable=no y maximum-scale de la etiqueta viewport en la cabecera de la página; una línea en la plantilla.'
        color_contrast:
            title: 'Texto con poco contraste (%count%×)'
            text: 'El texto claro sobre fondo claro, u oscuro sobre oscuro, cuesta leerlo a pleno sol y para aproximadamente uno de cada doce hombres (percepción de los colores). Se exige 4,5:1.'
            fix: 'Oscurezca un poco el color del texto o del fondo; normalmente es un solo valor de color en la hoja de estilos, sin rediseño.'
        image_alt:
            title: '%count% imágenes sin descripción'
            text: 'Los lectores de pantalla y Google no saben qué muestran estas imágenes.'
            fix: 'Añada un texto alternativo breve a cada imagen de contenido; las imágenes decorativas llevan un atributo alt vacío.'
        link_name:
            title: '%count% enlaces sin un nombre legible'
            text: 'Enlaces como "leer más" o los que solo tienen un icono no dicen nada a quienes usan un lector de pantalla.'
            fix: 'Dé a cada enlace un texto que diga adónde lleva, o un aria-label en los enlaces con icono.'
        button_name:
            title: '%count% botones sin nombre'
            text: 'Los botones con icono y sin etiqueta no se pueden usar con un lector de pantalla.'
            fix: 'Añada un aria-label a cada botón con icono (p. ej. "Abrir menú").'
        html_has_lang:
            title: 'Idioma de la página no declarado'
            text: 'Sin atributo de idioma, los lectores de pantalla eligen una pronunciación equivocada.'
            fix: 'Indique lang="es" (o su idioma) en el elemento <html>.'
        heading_order:
            title: 'Los títulos se saltan niveles'
            text: 'Se saltan niveles de título (h1 → h3), así que la estructura resulta confusa para las tecnologías de apoyo.'
            fix: 'Use los niveles de título en orden; deles estilo con CSS en lugar de elegir un nivel por su aspecto.'
        label:
            title: '%count% campos de formulario sin etiqueta'
            text: 'Los campos sin una etiqueta visible y vinculada son difíciles de rellenar y el autocompletado del navegador los ignora.'
            fix: 'Dé a cada campo un <label for> que coincida con el id del campo.'
        target_size:
            title: '%count% zonas táctiles demasiado pequeñas'
            text: 'Los enlaces o botones de menos de 24 px se fallan fácilmente con el pulgar.'
            fix: 'Amplíe la zona pulsable (padding) a 44 × 44 px como mínimo.'
        label_content_name_mismatch:
            title: '%count% controles cuyo nombre leído no coincide con su texto'
            text: 'Botones con icono (buscar, flechas, llamar) llevan un nombre accesible que no coincide con el texto visible, así que el control por voz y los lectores de pantalla anuncian otra cosa.'
            fix: 'Haga que el aria-label empiece con el texto visible, o deje que el texto del icono sea el nombre.'
    good:
        contrast:
            title: 'Los contrastes son correctos'
            text: 'Todos los textos revisados alcanzan la relación de contraste exigida.'
        images:
            title: 'Las imágenes están descritas'
            text: 'Las %count% imágenes de las páginas revisadas tienen texto alternativo.'
        lang:
            title: 'Idioma declarado'
            text: 'Los lectores de pantalla leen la página en el idioma correcto.'
        names:
            title: 'Enlaces y botones tienen nombre'
            text: 'Cada control tiene un nombre legible; los niveles de título están en orden.'
        targets:
            title: 'Zonas táctiles suficientemente grandes'
            text: 'Botones y enlaces se pueden pulsar con el pulgar.'

# ---------------------------------------------------------------- seo
seo:
    summary:
        good: 'Títulos, descripciones, encabezados y datos estructurados están en orden. Google puede leer el sitio.'
        ok: 'Lo básico está; conviene pulir algunos títulos, descripciones o detalles de estructura.'
        bad: 'Faltan aspectos básicos importantes para Google. Los buscadores encuentran el sitio, pero apenas saben de qué trata.'
    meta: 'SEO en Lighthouse %score% de 100 · %pages% páginas revisadas'
    issue:
        title_missing:
            title: 'Sin título de página en %page%'
            text: 'El título es el titular en los resultados de Google. Sin él, Google se inventa uno.'
            fix: 'Escriba un título de hasta 60 caracteres: qué ofrece y dónde (p. ej. "Dentista en Sevilla – Dra. Ejemplo").'
        title_long:
            title: 'Título de página demasiado largo en %page%'
            text: '%length% caracteres: Google corta los títulos a partir de unos 60.'
            fix: 'Acorte el título; las palabras más importantes, primero.'
        desc_missing:
            title: 'Sin descripción en %page%'
            text: 'La meta descripción es el texto gris bajo el resultado de Google. Si falta, Google muestra un fragmento cualquiera.'
            fix: 'Escriba 140–158 caracteres que digan qué ofrece la página y por qué merece la pena hacer clic.'
        desc_long:
            title: 'Descripción demasiado larga en %page%'
            text: '%length% caracteres: Google corta las descripciones a partir de unos 160.'
            fix: 'Acórtela a 140–158 caracteres.'
        h1_missing:
            title: 'Sin título principal en %page%'
            text: 'Cada página necesita exactamente un H1 que nombre el tema.'
            fix: 'Convierta el titular más importante en H1.'
        h1_multiple:
            title: '%count% títulos principales en %page%'
            text: 'Varios títulos H1 desdibujan de qué trata la página.'
            fix: 'Deje un solo H1 por página; convierta los demás en H2.'
        noindex:
            title: 'Página de inicio bloqueada para Google'
            text: 'La página de inicio lleva una instrucción "noindex": se le dice a Google que no la incluya.'
            fix: 'Quite el ajuste noindex en el CMS (normalmente una casilla en la página).'
        heading_skips:
            title: 'Niveles de título saltados (%count%×)'
            text: 'Saltos como H1 → H3 hacen que la estructura sea poco clara para Google y los lectores de pantalla.'
            fix: 'Use los niveles de título en orden.'
        sitemap_missing:
            title: 'No se ha encontrado ningún sitemap'
            text: 'Un sitemap.xml comunica a Google todas las páginas a la vez; sin él, las páginas nuevas se encuentran más tarde.'
            fix: 'Active el sitemap en el CMS y menciónelo en robots.txt.'
        schema:
            title: 'Sin datos estructurados'
            text: 'Los datos estructurados (schema.org) indican a Google y a los asistentes de IA qué tipo de negocio es, dónde está y cuándo abre.'
            fix: 'Añada datos de Organization o LocalBusiness con nombre, dirección, teléfono y horario (la mayoría de los CMS tienen un plugin).'
        not_crawlable:
            title: 'Página bloqueada para los buscadores'
            text: 'Las instrucciones para robots impiden que Google indexe la página.'
            fix: 'Revise robots.txt y la metaetiqueta robots; quite el bloqueo de las páginas públicas.'
        link_text:
            title: '%count% enlaces con texto sin significado'
            text: '"Haga clic aquí" o "más" no le dicen nada a Google sobre la página de destino.'
            fix: 'Use textos de enlace descriptivos ("nuestro horario de apertura").'
        crawlable_anchors:
            title: 'Enlaces que Google no puede seguir'
            text: 'Algunos enlaces se crean solo con JavaScript y son invisibles para los buscadores.'
            fix: 'Use enlaces <a href> normales para la navegación.'
        canonical:
            title: 'Enlace canónico erróneo'
            text: 'La etiqueta canonical apunta a una dirección errónea o inaccesible, lo que puede confundir a Google.'
            fix: 'Haga que el enlace canónico apunte a la propia página.'
        hreflang:
            title: 'Enlaces de idioma erróneos'
            text: 'Las etiquetas hreflang de las versiones de idioma contienen errores.'
            fix: 'Haga corregir las etiquetas hreflang (códigos de idioma válidos y todas las versiones enlazadas entre sí).'
        http_redirect:
            title: 'http no redirige a https'
            text: 'Los visitantes que escriben la dirección sin https llegan a la versión sin cifrar.'
            fix: 'Añada en el servidor una redirección permanente de http a https.'
    good:
        sitemap:
            title: 'Sitemap disponible'
            text: '%count% páginas figuran en él para Google.'
        titles:
            title: 'Títulos y descripciones definidos'
            text: 'Cada página revisada tiene su propio título y su propia descripción con una longitud adecuada.'
        h1:
            title: 'Un título principal por página'
            text: 'Estructura clara para Google y para los visitantes.'
        schema:
            title: 'Datos estructurados disponibles'
            text: 'Google y los asistentes de IA encuentran datos de tipo %types%.'
        https:
            title: 'Cifrado y redirigido'
            text: 'https con redirección desde http.'

# ---------------------------------------------------------------- AI visibility
ai:
    summary:
        good: 'Los asistentes de IA pueden leer y entender el sitio; hay un resumen (llms.txt).'
        ok: 'Los asistentes de IA pueden leer el sitio, pero tienen que deducir por su cuenta qué ofrece usted.'
        bad: 'Los buscadores con IA apenas ven el sitio: no hay resumen, los rastreadores están bloqueados o no hay datos de empresa identificables.'
    meta: 'llms.txt: %llms% · %blocked% rastreadores de IA bloqueados'
    issue:
        llms_missing:
            title: 'No hay llms.txt'
            text: 'ChatGPT, Perplexity y la IA de Google buscan un breve archivo de texto que diga qué hace la empresa, para quién y dónde. Sin él, lo deducen de las páginas.'
            fix: 'Cree /llms.txt: tres párrafos (oferta, público, ubicación/contacto) y enlaces a las páginas principales. Media hora de trabajo.'
        bots_blocked:
            title: 'Rastreadores de IA bloqueados: %bots%'
            text: 'robots.txt prohíbe a estos asistentes leer el sitio, así que no pueden recomendarlo.'
            fix: 'Permita los rastreadores en robots.txt, o decida conscientemente quedarse fuera de las respuestas de la IA.'
        no_identity_schema:
            title: 'La empresa no es legible por máquinas'
            text: 'Sin datos de Organization/LocalBusiness, un asistente no conoce con seguridad el nombre, la dirección ni el horario.'
            fix: 'Añada datos estructurados con nombre, dirección, teléfono, horario y zona de servicio.'
        offer_unclear:
            title: 'La oferta no aparece en las primeras frases'
            text: 'Las respuestas de la IA citan las primeras frases de una página. En la página de inicio, esas frases no dejan clara la oferta.'
            fix: 'Empiece la página con una frase sencilla: quién es usted, qué hace, para quién y dónde.'
    good:
        llms:
            title: 'llms.txt disponible'
            text: 'Los asistentes de IA reciben un resumen directamente de usted.'
        bots:
            title: 'Rastreadores de IA permitidos'
            text: 'GPTBot, ClaudeBot, PerplexityBot y Google-Extended pueden leer el sitio.'
        schema:
            title: 'Empresa legible por máquinas'
            text: 'Los datos estructurados de tipo %types% identifican a la empresa.'
        offer:
            title: 'Oferta clara desde el principio'
            text: 'Las primeras frases ya dicen a qué se dedica la empresa.'

# ---------------------------------------------------------------- content
content:
    summary:
        good: 'En cinco segundos queda claro qué hace la empresa, para quién y cuál es el siguiente paso.'
        ok: 'Se entiende, pero la oferta o el siguiente paso podrían ser más claros; algunos términos dan por hecho conocimientos previos.'
        bad: 'Los visitantes no entienden rápido qué se ofrece ni cómo ponerse en contacto. Eso cuesta consultas.'
    meta:
        ai: 'La IA leyó %pages% páginas como quien visita el sitio por primera vez'
        heuristic: 'Revisión heurística (sin IA configurada)'
    issue:
        no_cta:
            title: 'Falta un siguiente paso claro'
            text: 'Los visitantes interesados no ven a primera vista cómo llamar, pedir información o reservar.'
            fix: 'Coloque una acción destacada en la primera pantalla: "Llamar", "Pedir presupuesto" o "Reservar", con número de teléfono.'
        thin:
            title: 'Muy poco texto (%words% palabras)'
            text: 'Con tan poco texto, ni los visitantes ni Google llegan a saber qué ofrece usted.'
            fix: 'Describa la oferta, el público y la ubicación en dos o tres párrafos breves.'
        phone:
            title: 'El número de teléfono no se puede pulsar'
            text: 'En el móvil, un número debería poder pulsarse (enlace tel:). Aquí falta o es texto sin enlace.'
            fix: 'Enlace el número de teléfono con tel:+34…; colóquelo en la cabecera o el pie de todas las páginas.'
    good:
        cta:
            title: 'Siguiente paso claro'
            text: 'Los visitantes ven cómo ponerse en contacto.'
        length:
            title: 'Texto suficiente'
            text: '%words% palabras describen la oferta.'
        phone:
            title: 'Número de teléfono pulsable'
            text: 'Un toque en el móvil inicia la llamada.'

# ---------------------------------------------------------------- legal
legal:
    summary:
        good: 'Aviso legal, política de privacidad y gestión del consentimiento están en orden, en la medida en que puede comprobarse técnicamente.'
        ok: 'Hay aviso legal y política de privacidad; conviene revisar cómo se gestionan los servicios de terceros.'
        bad: 'Falta el aviso legal o la política de privacidad, o hay servicios de seguimiento que se cargan antes del consentimiento. Revíselo con su asesor jurídico.'
    meta: 'Revisión técnica, no asesoramiento jurídico'
    note: 'Esta es una revisión técnica: busca las páginas legales y los servicios que se cargan antes de cualquier consentimiento. No es asesoramiento jurídico; haga revisar los detalles por su asesor jurídico.'
    issue:
        imprint:
            title: 'No se ha encontrado el aviso legal'
            text: 'En las páginas revisadas no se ha encontrado ningún enlace a un aviso legal, o la página no es accesible.'
            fix: 'Enlace una página de aviso legal desde todas las páginas (pie de página), con los datos obligatorios.'
        privacy:
            title: 'No se ha encontrado la política de privacidad'
            text: 'No se ha encontrado ningún enlace a una política de privacidad, o la página no es accesible.'
            fix: 'Enlace la política de privacidad desde todas las páginas (pie de página); debe mencionar todos los servicios utilizados.'
        tracking:
            title: 'Seguimiento antes del consentimiento: %services%'
            text: 'Estos servicios se cargan en la primera visita, antes de que el visitante haya podido dar su consentimiento. Según el RGPD y la normativa sobre cookies, esto requiere consentimiento previo.'
            fix: 'Cargue estos servicios solo después del consentimiento en el banner de cookies (o configure la herramienta de consentimiento para que los bloquee).'
        embeds:
            title: 'Servicios de terceros sin herramienta de consentimiento: %services%'
            text: 'Se cargan servicios externos sin banner de consentimiento. Según el servicio, puede ser necesario el consentimiento.'
            fix: 'Aloje las fuentes en su propio servidor; cargue mapas y vídeos tras un clic o a través de la herramienta de consentimiento.'
    good:
        imprint:
            title: 'Aviso legal disponible'
            text: 'Enlazado y accesible.'
        privacy:
            title: 'Política de privacidad disponible'
            text: 'Enlazada y accesible.'
        no_third_party:
            title: 'Ningún servicio de terceros antes del consentimiento'
            text: 'No se carga nada externo en la primera visita.'
        cmp:
            title: 'Herramienta de consentimiento disponible'
            text: 'Se ha encontrado un banner de cookies o una herramienta de consentimiento.'

# ---------------------------------------------------------------- mobile
mobile:
    summary:
        good: 'Se adapta a la pantalla del móvil; botones y textos tienen un tamaño suficiente.'
        ok: 'Se puede usar en el móvil; algunas zonas táctiles o tamaños de letra son demasiado pequeños.'
        bad: 'Difícil de usar en el móvil: sin ajuste viewport, zonas táctiles demasiado pequeñas o contenido más ancho que la pantalla.'
        unknown: 'No se ha podido medir por completo (sin resultado de PageSpeed).'
    meta: 'Viewport, zonas táctiles, tamaño de letra, ancho del contenido'
    issue:
        viewport:
            title: 'Sin viewport para móvil'
            text: 'En el móvil, la página se muestra como una página de escritorio reducida.'
            fix: 'Añada <meta name="viewport" content="width=device-width, initial-scale=1"> en la cabecera de la página.'
        targets:
            title: '%count% zonas táctiles demasiado pequeñas'
            text: 'Los enlaces o botones son demasiado pequeños o están demasiado juntos para el pulgar.'
            fix: 'Amplíe la zona táctil a 44 × 44 px como mínimo y deje espacio entre los enlaces.'
        font:
            title: 'Texto demasiado pequeño en el móvil'
            text: 'El %value% del texto mide menos de 12 px y cuesta leerlo en el móvil.'
            fix: 'Use al menos 16 px para el texto principal.'
        width:
            title: 'Contenido más ancho que la pantalla'
            text: 'Los visitantes tienen que desplazarse hacia los lados.'
            fix: 'Corrija los elementos de ancho fijo (tablas, imágenes, contenidos incrustados) con max-width: 100 %.'
    good:
        viewport:
            title: 'Viewport para móvil configurado'
