# NEO Website Check — Polish texts (front end, report, e-mail).
# Copy to translations/neo_websitecheck.pl.yaml in your project to override single keys.
word:
    yes: 'tak'
    no: 'nie'
    none: 'brak'
grade:
    1: 'Bardzo dobry'
    2: 'Dobry'
    3: 'Dostateczny'
    4: 'Dopuszczający'
    5: 'Niedostateczny'
verdict:
    good: 'Solidna strona. Nic pilnego — kilka drobnych zmian sprawi, że będzie jeszcze lepsza.'
    mid: 'Dobra podstawa, ale niektóre punkty prawdopodobnie kosztują Państwa zapytania. Najważniejsze z nich znajdą Państwo poniżej.'
    low: 'Wyraźna potrzeba działania. Proszę zacząć od trzech poniższych działań — wtedy strona stanie się narzędziem, które przyciąga klientów.'
area:
    speed: 'Szybkość ładowania'
    accessibility: 'Dostępność'
    seo: 'Widoczność w Google'
    ai: 'Widoczność w wyszukiwarkach AI'
    content: 'Treść i przejrzystość'
    legal: 'Prawo i prywatność'
    mobile: 'Urządzenia mobilne'
    unavailable: 'Tym razem nie udało się tego zmierzyć.'
measure:
    effort:
        small: 'niewielki nakład pracy'
        medium: 'średni nakład pracy'
        large: 'duży nakład pracy'

# ---------------------------------------------------------------- speed
speed:
    summary:
        good: 'Strona startowa jest widoczna na telefonie po %lcp% s. To szybciej niż w przypadku większości stron.'
        ok: 'Strona startowa ładuje się na telefonie %lcp% s. Da się z niej korzystać, ale część odwiedzających wychodzi, zanim będzie gotowa.'
        bad: 'Strona startowa potrzebuje na telefonie %lcp% s. Wielu odwiedzających wychodzi, zanim cokolwiek się pojawi.'
    meta: 'Wydajność %perf% na 100 · LCP %lcp% s · CLS %cls%'
    kpi:
        lcp: 'Główna treść widoczna (LCP)'
        lcp_note: 'limit 2,5 s'
        cls: 'Przesunięcia układu (CLS)'
        cls_note: 'limit 0,1'
        tbt: 'Czas blokady (TBT)'
        tbt_note: 'limit 200 ms'
        inp: 'Reakcja na dotyk (INP)'
        inp_note: 'limit 200 ms'
        perf: 'Wynik wydajności'
        perf_note: 'na 100'
        bytes: 'Rozmiar strony'
        bytes_note: 'limit 2 MB'
        requests: 'Zapytania'
        requests_note: 'limit 80'
    issue:
        lcp:
            title: 'Strona startowa ładuje się wolno na telefonach'
            text: 'Główna treść pojawia się po %lcp% s. Google wyznacza granicę na 2,5 sekundy; odwiedzający oceniają stronę jeszcze szybciej.'
            fix: 'Zmniejszyć największy obraz widoczny od razu, ładować skrypty później i włączyć na serwerze kompresję plików. Zwykle to jedna do dwóch godzin pracy.'
        largest_image:
            title: 'Jeden obraz waży %kb% KB'
            text: 'Plik „%file%” jest najcięższym elementem strony startowej i opóźnia wszystko, co następuje po nim.'
            fix: 'Wyeksportować obraz w wyświetlanej szerokości (zwykle 1200–1600 px) jako WebP lub AVIF. Często jest wtedy o 80 % mniejszy bez widocznej różnicy.'
        render_blocking:
            title: 'Pliki blokujące pierwsze wyświetlenie: %count%'
            text: 'Arkusze stylów lub skrypty w nagłówku strony są w całości ładowane, zanim cokolwiek zostanie wyświetlone.'
            fix: 'Ładować mniej istotne pliki CSS i JavaScript z opóźnieniem lub asynchronicznie; w nagłówku zostawić tylko niezbędne style.'
        image_formats:
            title: 'Obrazy w przestarzałych formatach'
            text: 'JPEG/PNG tam, gdzie WebP lub AVIF byłyby o 30–70 % mniejsze.'
            fix: 'Ustawić w CMS automatyczne dostarczanie nowoczesnych formatów (w większości systemów wystarczy jedno ustawienie).'
        responsive_images:
            title: 'Obrazy większe niż wyświetlane'
            text: 'Telefony pobierają obrazy w rozmiarze dla komputerów i dopiero je pomniejszają.'
            fix: 'Udostępniać obrazy w kilku rozmiarach (srcset); CMS zwykle potrafi je wygenerować.'
        unused_js:
            title: 'Nieużywany JavaScript'
            text: 'Ładowane są skrypty, których ta strona nie używa. Kosztują czas i baterię.'
            fix: 'Usunąć nieużywane wtyczki i skrypty śledzące; pozostałe ładować tylko na stronach, które ich potrzebują.'
        ttfb:
            title: 'Serwer odpowiada wolno'
            text: 'Serwer potrzebuje %value% na wysłanie pierwszego bajtu, zanim przeglądarka może cokolwiek zrobić.'
            fix: 'Włączyć w CMS pamięć podręczną stron lub poprosić firmę hostingową o szybszy pakiet.'
        compression:
            title: 'Pliki są przesyłane bez kompresji'
            text: 'Pliki tekstowe (HTML, CSS, JavaScript) nie są kompresowane w drodze do przeglądarki.'
            fix: 'Włączyć na serwerze kompresję gzip lub Brotli (jeden wiersz w konfiguracji serwera).'
        cls:
            title: 'Treść przeskakuje podczas ładowania (CLS %cls%)'
            text: 'Elementy przesuwają się już po pojawieniu się, przez co odwiedzający klikają w złe miejsce lub gubią się w tekście.'
            fix: 'Zarezerwować miejsce na obrazy, reklamy i czcionki (atrybuty width/height, font-display: swap).'
        bytes:
            title: 'Strona startowa waży %mb% MB'
            text: 'Przy połączeniu mobilnym trwa to kilka sekund i zużywa pakiet danych.'
            fix: 'Skompresować obrazy i filmy; filmy ładować dopiero wtedy, gdy są widoczne.'
        console:
            title: 'Błędy w konsoli przeglądarki: %count%'
            text: 'Błędy JavaScript wskazują na niedziałające funkcje, na które mogą trafić odwiedzający.'
            fix: 'Zlecić sprawdzenie błędów twórcy strony; zwykle chodzi o przestarzałe wtyczki.'
    good:
        lcp:
            title: 'Szybka na telefonach'
            text: 'Główna treść jest widoczna po %lcp% s — poniżej 2,5 s, których oczekuje Google. To podstawa, której brakuje wielu stronom.'
        cls:
            title: 'Nic nie przeskakuje'
            text: 'Układ pozostaje stabilny podczas ładowania; odwiedzający mogą od razu czytać i klikać.'
        https:
            title: 'HTTPS skonfigurowany poprawnie'
            text: 'Szyfrowane połączenie z ważnym certyfikatem; zwykłe http przekierowuje na https.'
        console:
            title: 'Brak błędów w przeglądarce'
            text: 'Konsola przeglądarki jest czysta — żadnych niedziałających skryptów.'
        images:
            title: 'Obrazy dostarczane prawidłowo'
            text: 'Nowoczesne formaty i rozmiary dopasowane do telefonu i komputera.'

# ---------------------------------------------------------------- accessibility
a11y:
    summary:
        good: 'Bez barier w testach automatycznych: teksty są czytelne, elementy sterujące mają etykiety.'
        ok: 'W większości w porządku. Uwagi dotyczące kontrastu (%count%) i kilka brakujących etykiet dzielą stronę od najwyższej oceny.'
        bad: 'Kilka barier: uwagi dotyczące kontrastu (%count%), brakujące etykiety lub opisy. To utrudnia korzystanie również zwykłym odwiedzającym.'
    meta: 'Dostępność w Lighthouse %score% na 100 · uwagi dotyczące kontrastu: %count%'
    issue:
        meta_viewport:
            title: 'Powiększanie jest zablokowane na telefonach'
            text: 'Strona uniemożliwia powiększanie dwoma palcami. Osoby słabowidzące nie mogą powiększyć tekstu.'
            fix: 'Usunąć user-scalable=no i maximum-scale ze znacznika viewport w nagłówku strony — jeden wiersz w szablonie.'
        color_contrast:
            title: 'Tekst o zbyt małym kontraście (%count%×)'
            text: 'Jasny tekst na jasnym tle lub ciemny na ciemnym jest trudny do odczytania w słońcu oraz dla mniej więcej co dwunastego mężczyzny (zaburzenia widzenia barw). Wymagane: 4,5:1.'
            fix: 'Nieco przyciemnić kolor tekstu lub tła — zwykle to jedna wartość koloru w arkuszu stylów, bez przeprojektowania.'
        image_alt:
            title: 'Obrazy bez opisu: %count%'
            text: 'Czytniki ekranu i Google nie wiedzą, co przedstawiają te obrazy.'
            fix: 'Dodać do każdego obrazu z treścią krótki tekst alternatywny (alt); obrazy dekoracyjne otrzymują pusty atrybut alt.'
        link_name:
            title: 'Linki bez czytelnej nazwy: %count%'
            text: 'Linki typu „czytaj więcej” albo same ikony nic nie mówią użytkownikom czytników ekranu.'
            fix: 'Nadać każdemu linkowi tekst mówiący, dokąd prowadzi, a linkom z ikoną — aria-label.'
        button_name:
            title: 'Przyciski bez nazwy: %count%'
            text: 'Przycisków z samą ikoną i bez etykiety nie mogą obsłużyć użytkownicy czytników ekranu.'
            fix: 'Dodać aria-label do każdego przycisku z ikoną (np. „Otwórz menu”).'
        html_has_lang:
            title: 'Nie określono języka strony'
            text: 'Bez atrybutu języka czytniki ekranu wybierają złą wymowę.'
            fix: 'Ustawić lang="pl" (lub odpowiedni język) w elemencie <html>.'
        heading_order:
            title: 'Nagłówki pomijają poziomy'
            text: 'Poziomy nagłówków są pomijane (h1 → h3), przez co struktura jest niezrozumiała dla technologii wspomagających.'
            fix: 'Używać poziomów nagłówków po kolei; wygląd nadawać przez CSS, a nie wybierać poziom ze względu na wygląd.'
        label:
            title: 'Pola formularza bez etykiety: %count%'
            text: 'Pola bez widocznej, powiązanej etykiety trudno wypełnić, a autouzupełnianie przeglądarki je pomija.'
            fix: 'Nadać każdemu polu <label for> zgodny z id pola.'
        target_size:
            title: 'Zbyt małe elementy dotykowe: %count%'
            text: 'Linki lub przyciski mniejsze niż 24 px łatwo chybić kciukiem.'
            fix: 'Powiększyć klikalny obszar (padding) do co najmniej 44 × 44 px.'
        label_content_name_mismatch:
            title: 'Elementy sterujące, których odczytywana nazwa różni się od etykiety: %count%'
            text: 'Przyciski z ikoną (wyszukiwanie, strzałki, połączenie) mają nazwę dostępności niezgodną z widocznym tekstem, więc sterowanie głosem i czytniki ekranu podają coś innego.'
            fix: 'Rozpoczynać aria-label od widocznego tekstu albo użyć tekstu ikony jako nazwy.'
    good:
        contrast:
            title: 'Kontrasty w porządku'
            text: 'Każdy sprawdzony tekst osiąga wymagany współczynnik kontrastu.'
        images:
            title: 'Obrazy mają opisy'
            text: 'Wszystkie obrazy na sprawdzonych stronach (%count%) mają tekst alternatywny.'
        lang:
            title: 'Język określony'
            text: 'Czytniki ekranu odczytują stronę we właściwym języku.'
        names:
            title: 'Linki i przyciski mają nazwy'
            text: 'Każdy element sterujący ma czytelną nazwę; poziomy nagłówków są uporządkowane.'
        targets:
            title: 'Elementy dotykowe wystarczająco duże'
            text: 'Przyciski i linki można łatwo trafić kciukiem.'

# ---------------------------------------------------------------- seo
seo:
    summary:
        good: 'Tytuły, opisy, nagłówki i dane strukturalne są poprawne. Google dobrze odczytuje stronę.'
        ok: 'Podstawy są; warto uporządkować kilka tytułów, opisów lub szczegółów struktury.'
        bad: 'Brakuje ważnych podstaw dla Google. Wyszukiwarki znajdują stronę, ale ledwo wiedzą, czego dotyczy.'
    meta: 'SEO w Lighthouse %score% na 100 · sprawdzone strony: %pages%'
    issue:
        title_missing:
            title: 'Brak tytułu strony na %page%'
            text: 'Tytuł to nagłówek w wynikach Google. Bez niego Google wymyśla własny.'
            fix: 'Napisać tytuł do 60 znaków: co Państwo oferują i gdzie (np. „Dentysta w Krakowie – dr Przykładowy”).'
        title_long:
            title: 'Zbyt długi tytuł strony na %page%'
            text: 'Liczba znaków: %length% — Google obcina tytuły po około 60 znakach.'
            fix: 'Skrócić tytuł; najważniejsze słowa na początku.'
        desc_missing:
            title: 'Brak opisu na %page%'
            text: 'Opis meta to szary tekst pod wynikiem w Google. Jeśli go brakuje, Google pokazuje przypadkowy fragment.'
            fix: 'Napisać 140–158 znaków, które mówią, co oferuje strona i dlaczego warto w nią kliknąć.'
        desc_long:
            title: 'Zbyt długi opis na %page%'
            text: 'Liczba znaków: %length% — Google obcina opisy po około 160 znakach.'
            fix: 'Skrócić do 140–158 znaków.'
        h1_missing:
            title: 'Brak nagłówka głównego na %page%'
            text: 'Każda strona potrzebuje dokładnie jednego nagłówka H1, który nazywa jej temat.'
            fix: 'Ustawić najważniejszy nagłówek jako H1.'
        h1_multiple:
            title: 'Kilka nagłówków głównych (%count%) na %page%'
            text: 'Kilka nagłówków H1 rozmywa to, czego dotyczy strona.'
            fix: 'Zostawić jeden H1 na stronę; pozostałe zmienić na H2.'
        noindex:
            title: 'Strona startowa zablokowana dla Google'
            text: 'Strona startowa zawiera instrukcję „noindex”: Google otrzymuje polecenie, aby jej nie wyświetlać w wynikach.'
            fix: 'Usunąć ustawienie noindex w CMS (zwykle pole wyboru przy stronie).'
        heading_skips:
            title: 'Pominięte poziomy nagłówków (%count%×)'
            text: 'Przeskoki takie jak H1 → H3 zaciemniają strukturę dla Google i czytników ekranu.'
            fix: 'Używać poziomów nagłówków po kolei.'
        sitemap_missing:
            title: 'Nie znaleziono mapy witryny'
            text: 'Plik sitemap.xml od razu podaje Google wszystkie strony; bez niego nowe strony są znajdowane później.'
            fix: 'Włączyć mapę witryny w CMS i wskazać ją w pliku robots.txt.'
        schema:
            title: 'Brak danych strukturalnych'
            text: 'Dane strukturalne (schema.org) mówią Google i asystentom AI, jaki to rodzaj firmy, gdzie się znajduje i kiedy jest otwarta.'
            fix: 'Dodać dane Organization lub LocalBusiness z nazwą, adresem, telefonem i godzinami otwarcia (większość systemów CMS ma do tego wtyczkę).'
        not_crawlable:
            title: 'Strona zablokowana dla wyszukiwarek'
            text: 'Instrukcje dla robotów uniemożliwiają Google indeksowanie strony.'
            fix: 'Sprawdzić robots.txt i znacznik meta robots; usunąć blokadę dla stron publicznych.'
        link_text:
            title: 'Linki z nic niemówiącym tekstem: %count%'
            text: '„Kliknij tutaj” albo „więcej” nic nie mówi Google o stronie docelowej.'
            fix: 'Używać opisowych tekstów linków („nasze godziny otwarcia”).'
        crawlable_anchors:
            title: 'Linki, za którymi Google nie może podążać'
            text: 'Niektóre linki są zbudowane wyłącznie w JavaScript i są niewidoczne dla wyszukiwarek.'
            fix: 'W nawigacji używać zwykłych linków <a href>.'
        canonical:
            title: 'Błędny link kanoniczny'
            text: 'Znacznik canonical wskazuje na zły lub nieosiągalny adres, co może wprowadzać Google w błąd.'
            fix: 'Ustawić link kanoniczny na adres samej strony.'
        hreflang:
            title: 'Błędne linki językowe'
            text: 'Znaczniki hreflang dla wersji językowych zawierają błędy.'
            fix: 'Zlecić poprawienie znaczników hreflang (prawidłowe kody języków, wszystkie wersje wzajemnie się wskazują).'
        http_redirect:
            title: 'http nie przekierowuje na https'
            text: 'Odwiedzający, którzy wpiszą adres bez https, trafiają na wersję nieszyfrowaną.'
            fix: 'Dodać na serwerze stałe przekierowanie z http na https.'
    good:
        sitemap:
            title: 'Mapa witryny jest dostępna'
            text: 'Strony zgłoszone do Google: %count%.'
        titles:
            title: 'Tytuły i opisy ustawione'
            text: 'Każda sprawdzona strona ma własny tytuł i opis o odpowiedniej długości.'
        h1:
            title: 'Jeden nagłówek główny na stronę'
            text: 'Przejrzysta struktura dla Google i odwiedzających.'
        schema:
            title: 'Dane strukturalne są dostępne'
            text: 'Google i asystenci AI znajdują dane typu %types%.'
        https:
            title: 'Szyfrowanie i przekierowanie'
            text: 'https z przekierowaniem z http.'

# ---------------------------------------------------------------- AI visibility
ai:
    summary:
        good: 'Asystenci AI mogą odczytać i zrozumieć stronę; podsumowanie (llms.txt) jest dostępne.'
        ok: 'Asystenci AI mogą odczytać stronę, ale muszą sami poskładać, co Państwo oferują.'
        bad: 'Wyszukiwarki AI prawie nie widzą strony: brak podsumowania, zablokowane roboty lub brak rozpoznawalnych danych firmy.'
    meta: 'llms.txt: %llms% · zablokowane roboty AI: %blocked%'
    issue:
        llms_missing:
            title: 'Brak llms.txt'
            text: 'ChatGPT, Perplexity i AI Google szukają krótkiego pliku tekstowego, który mówi, czym zajmuje się firma, dla kogo i gdzie. Bez niego zgadują na podstawie stron.'
            fix: 'Utworzyć /llms.txt: trzy akapity (oferta, grupa docelowa, lokalizacja/kontakt) oraz linki do najważniejszych stron. Pół godziny pracy.'
        bots_blocked:
            title: 'Zablokowane roboty AI: %bots%'
            text: 'robots.txt zabrania tym asystentom odczytywania strony, więc nie mogą jej polecać.'
            fix: 'Zezwolić robotom w robots.txt — albo świadomie zdecydować o pozostaniu poza odpowiedziami AI.'
        no_identity_schema:
            title: 'Dane firmy nieczytelne dla maszyn'
            text: 'Bez danych Organization/LocalBusiness asystent nie zna wiarygodnie nazwy, adresu ani godzin otwarcia.'
            fix: 'Dodać dane strukturalne z nazwą, adresem, telefonem, godzinami otwarcia i obsługiwanym obszarem.'
        offer_unclear:
            title: 'Oferty brak w pierwszych zdaniach'
            text: 'Odpowiedzi AI cytują pierwsze zdania strony. Na stronie startowej nie przedstawiają one jasno oferty.'
            fix: 'Zacząć stronę jednym prostym zdaniem: kim Państwo są, co robią, dla kogo i gdzie.'
    good:
        llms:
            title: 'llms.txt jest dostępny'
            text: 'Asystenci AI otrzymują podsumowanie prosto od Państwa.'
        bots:
            title: 'Roboty AI dopuszczone'
            text: 'GPTBot, ClaudeBot, PerplexityBot i Google-Extended mogą odczytywać stronę.'
        schema:
            title: 'Dane firmy czytelne dla maszyn'
            text: 'Dane strukturalne typu %types% identyfikują firmę.'
        offer:
            title: 'Oferta przedstawiona od razu'
            text: 'Już pierwsze zdania mówią, czym zajmuje się firma.'

# ---------------------------------------------------------------- content
content:
    summary:
        good: 'W ciągu pięciu sekund jasne jest, czym zajmuje się firma, dla kogo i co zrobić dalej.'
        ok: 'Zrozumiała, ale oferta lub kolejny krok mogłyby być jaśniejsze; niektóre pojęcia zakładają wiedzę fachową.'
        bad: 'Odwiedzający nie rozumieją szybko, co jest oferowane ani jak się skontaktować. To kosztuje zapytania.'
    meta:
        ai: 'AI przeczytała strony (%pages%) jak ktoś, kto odwiedza je po raz pierwszy'
        heuristic: 'Sprawdzenie heurystyczne (AI nie jest skonfigurowana)'
    issue:
        no_cta:
            title: 'Brak jasnego kolejnego kroku'
            text: 'Zainteresowani odwiedzający nie widzą na pierwszy rzut oka, jak zadzwonić, wysłać zapytanie lub zarezerwować.'
            fix: 'Umieścić na pierwszym ekranie jedno wyraźne wezwanie do działania: „Zadzwoń”, „Zapytaj o ofertę” lub „Zarezerwuj” — z numerem telefonu.'
        thin:
            title: 'Bardzo mało tekstu (słowa: %words%)'
            text: 'Przy tak małej ilości tekstu ani odwiedzający, ani Google nie dowiedzą się, co Państwo oferują.'
            fix: 'Opisać ofertę, grupę docelową i lokalizację w dwóch lub trzech krótkich akapitach.'
        phone:
            title: 'Numer telefonu nie jest klikalny'
            text: 'Na telefonach numer powinien dać się dotknąć, aby zadzwonić (link tel:). Tutaj go brakuje lub jest zwykłym tekstem.'
            fix: 'Podlinkować numer telefonu jako tel:+48…; umieścić go w nagłówku lub stopce każdej strony.'
    good:
        cta:
            title: 'Jasny kolejny krok'
            text: 'Odwiedzający widzą, jak się skontaktować.'
        length:
            title: 'Wystarczająco dużo tekstu'
            text: 'Liczba słów opisujących ofertę: %words%.'
        phone:
            title: 'Numer telefonu klikalny'
            text: 'Jedno dotknięcie na telefonie rozpoczyna połączenie.'

# ---------------------------------------------------------------- legal
legal:
    summary:
        good: 'Nota prawna, polityka prywatności i obsługa zgód są na miejscu — w zakresie, w jakim można to sprawdzić technicznie.'
        ok: 'Nota prawna i polityka prywatności istnieją; warto sprawdzić sposób korzystania z usług zewnętrznych.'
        bad: 'Brak noty prawnej lub polityki prywatności albo usługi śledzące ładują się przed wyrażeniem zgody. Prosimy skonsultować to z doradcą prawnym.'
    meta: 'Sprawdzenie techniczne, nie porada prawna'
    note: 'To jest sprawdzenie techniczne: szuka odpowiednich stron oraz usług ładowanych przed wyrażeniem jakiejkolwiek zgody. Nie stanowi porady prawnej — szczegóły prosimy skonsultować z doradcą prawnym.'
    issue:
        imprint:
            title: 'Nie znaleziono noty prawnej (impressum)'
            text: 'Na sprawdzonych stronach nie znaleziono linku do strony z notą prawną albo ta strona jest nieosiągalna.'
            fix: 'Podlinkować stronę z notą prawną i wymaganymi danymi firmy na każdej stronie (w stopce).'
        privacy:
            title: 'Nie znaleziono polityki prywatności'
            text: 'Nie znaleziono linku do polityki prywatności albo ta strona jest nieosiągalna.'
            fix: 'Podlinkować politykę prywatności na każdej stronie (w stopce); musi ona wymieniać każdą używaną usługę.'
        tracking:
            title: 'Śledzenie przed zgodą: %services%'
            text: 'Te usługi ładują się przy pierwszej wizycie, zanim odwiedzający mógł wyrazić zgodę. Zgodnie z RODO i przepisami o plikach cookie wymaga to wcześniejszej zgody.'
            fix: 'Ładować te usługi dopiero po wyrażeniu zgody w banerze cookie (lub skonfigurować narzędzie do zgód tak, aby je blokowało).'
        embeds:
            title: 'Usługi zewnętrzne bez narzędzia do zgód: %services%'
            text: 'Zewnętrzne usługi ładują się bez banera zgody. W zależności od usługi zgoda może być wymagana.'
            fix: 'Udostępniać czcionki z własnego serwera; mapy i filmy ładować po kliknięciu lub przez narzędzie do zgód.'
    good:
        imprint:
            title: 'Nota prawna jest dostępna'
            text: 'Podlinkowana i osiągalna.'
        privacy:
            title: 'Polityka prywatności jest dostępna'
            text: 'Podlinkowana i osiągalna.'
        no_third_party:
            title: 'Brak usług zewnętrznych przed zgodą'
            text: 'Przy pierwszej wizycie nic zewnętrznego się nie ładuje.'
        cmp:
            title: 'Narzędzie do zgód jest dostępne'
            text: 'Znaleziono baner cookie / narzędzie do zarządzania zgodami.'

# ---------------------------------------------------------------- mobile
mobile:
    summary:
        good: 'Dopasowana do ekranu telefonu; przyciski i tekst są wystarczająco duże.'
        ok: 'Da się korzystać na telefonach; kilka elementów dotykowych lub rozmiarów czcionki jest za małych.'
        bad: 'Trudna w obsłudze na telefonach: brak ustawienia viewport, zbyt małe elementy dotykowe lub treść szersza niż ekran.'
        unknown: 'Nie udało się w pełni zmierzyć (brak wyniku PageSpeed).'
    meta: 'Viewport, elementy dotykowe, rozmiar czcionki, szerokość treści'
    issue:
        viewport:
            title: 'Brak mobilnego viewportu'
            text: 'Na telefonach strona jest wyświetlana jako pomniejszona wersja dla komputerów.'
            fix: 'Dodać <meta name="viewport" content="width=device-width, initial-scale=1"> w nagłówku strony.'
        targets:
            title: 'Zbyt małe elementy dotykowe: %count%'
            text: 'Linki lub przyciski są za małe albo za blisko siebie, by trafić w nie kciukiem.'
            fix: 'Powiększyć obszar dotyku do co najmniej 44 × 44 px i dodać odstępy między linkami.'
        font:
            title: 'Za mały tekst na telefonach'
            text: '%value% tekstu ma rozmiar poniżej 12 px, przez co trudno go odczytać na telefonach.'
            fix: 'Używać co najmniej 16 px dla tekstu głównego.'
        width:
            title: 'Treść szersza niż ekran'
            text: 'Odwiedzający muszą przewijać w bok.'
            fix: 'Poprawić elementy o stałej szerokości (tabele, obrazy, osadzenia) za pomocą max-width: 100 %.'
    good:
        viewport:
            title: 'Mobilny viewport ustawiony'
            text: 'Strona dopasowuje się do ekranu telefonu.'
        targets:
            title: 'Elementy dotykowe w porządku'
            text: 'Linki i przyciski można łatwo trafić kciukiem.'
        font:
            title: 'Tekst czytelny'
            text: 'Rozmiary czcionki są wystarczająco duże dla telefonów.'

