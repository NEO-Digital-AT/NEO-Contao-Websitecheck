# NEO Website Check — French texts (front end, report, e-mail).
# Copy to translations/neo_websitecheck.fr.yaml in your project to override single keys.
word:
    yes: 'oui'
    no: 'non'
    none: 'aucun'
grade:
    1: 'Très bien'
    2: 'Bien'
    3: 'Satisfaisant'
    4: 'Suffisant'
    5: 'Insuffisant'
verdict:
    good: 'Un site solide. Rien d’urgent, quelques petits détails le rendraient encore meilleur.'
    mid: 'Une bonne base, mais certains points vous font probablement perdre des demandes. Les plus importants figurent ci-dessous.'
    low: 'Il y a clairement des choses à faire. Commencez par les trois mesures ci-dessous : votre site deviendra alors un outil qui vous amène des clients.'
area:
    speed: 'Vitesse de chargement'
    accessibility: 'Accessibilité'
    seo: 'Visibilité sur Google'
    ai: 'Visibilité dans la recherche IA'
    content: 'Contenu et clarté'
    legal: 'Juridique et confidentialité'
    mobile: 'Mobile'
    unavailable: 'N’a pas pu être mesuré cette fois-ci.'
measure:
    effort:
        small: 'effort faible'
        medium: 'effort moyen'
        large: 'effort important'

# ---------------------------------------------------------------- speed
speed:
    summary:
        good: 'Sur un téléphone, la page d’accueil s’affiche après %lcp% s. C’est plus rapide que la plupart des sites.'
        ok: 'Sur un téléphone, la page d’accueil met %lcp% s à s’afficher. C’est utilisable, mais certains visiteurs partent avant qu’elle soit prête.'
        bad: 'Sur un téléphone, la page d’accueil met %lcp% s à s’afficher. Beaucoup de visiteurs partent avant que quoi que ce soit n’apparaisse.'
    meta: 'Performance %perf% sur 100 · LCP %lcp% s · CLS %cls%'
    kpi:
        lcp: 'Contenu principal visible (LCP)'
        lcp_note: 'limite 2,5 s'
        cls: 'Décalages de mise en page (CLS)'
        cls_note: 'limite 0,1'
        tbt: 'Temps de blocage (TBT)'
        tbt_note: 'limite 200 ms'
        inp: 'Réaction au toucher (INP)'
        inp_note: 'limite 200 ms'
        perf: 'Score de performance'
        perf_note: 'sur 100'
        bytes: 'Poids de la page'
        bytes_note: 'limite 2 Mo'
        requests: 'Requêtes'
        requests_note: 'limite 80'
    issue:
        lcp:
            title: 'La page d’accueil se charge lentement sur téléphone'
            text: 'Le contenu principal apparaît au bout de %lcp% secondes. Google fixe la limite à 2,5 secondes ; les visiteurs jugent encore plus vite.'
            fix: 'Réduire la plus grande image visible sans défiler, charger les scripts plus tard et faire envoyer des fichiers compressés par le serveur. En général une à deux heures de travail.'
        largest_image:
            title: 'Une image pèse %kb% Ko'
            text: 'Le fichier « %file% » est l’élément le plus lourd de la page d’accueil et retarde tout ce qui suit.'
            fix: 'Exporter l’image à la largeur affichée (généralement 1200–1600 px) en WebP ou AVIF. Souvent 80 % plus légère, sans différence visible.'
        render_blocking:
            title: '%count% fichiers bloquent le premier affichage'
            text: 'Des feuilles de style ou des scripts dans l’en-tête de la page sont chargés entièrement avant que quoi que ce soit ne s’affiche.'
            fix: 'Charger le CSS et le JavaScript non essentiels en différé ou de manière asynchrone ; ne garder dans l’en-tête que les styles indispensables.'
        image_formats:
            title: 'Images dans des formats anciens'
            text: 'Du JPEG/PNG là où le WebP ou l’AVIF seraient 30–70 % plus légers.'
            fix: 'Faire livrer automatiquement des formats modernes par le CMS (la plupart des systèmes le font avec un simple réglage).'
        responsive_images:
            title: 'Images plus grandes que leur affichage'
            text: 'Les téléphones téléchargent des images au format ordinateur et les réduisent ensuite.'
            fix: 'Proposer les images en plusieurs tailles (srcset) ; le CMS peut généralement les générer.'
        unused_js:
            title: 'JavaScript inutilisé'
            text: 'Des scripts que cette page n’utilise pas sont chargés. Ils coûtent du temps et de la batterie.'
            fix: 'Supprimer les plugins et scripts de suivi inutilisés ; ne charger le reste que sur les pages qui en ont besoin.'
        ttfb:
            title: 'Le serveur répond lentement'
            text: 'Le serveur met %value% à livrer le premier octet, avant même que le navigateur puisse faire quoi que ce soit.'
            fix: 'Activer la mise en cache des pages dans le CMS ou demander une offre plus rapide à l’hébergeur.'
        compression:
            title: 'Les fichiers sont envoyés sans compression'
            text: 'Les fichiers texte (HTML, CSS, JavaScript) ne sont pas compressés lors de leur envoi au navigateur.'
            fix: 'Activer la compression gzip ou Brotli sur le serveur (une ligne dans la configuration du serveur).'
        cls:
            title: 'Le contenu saute pendant le chargement (CLS %cls%)'
            text: 'Des éléments se déplacent après leur apparition : les visiteurs cliquent au mauvais endroit ou perdent le fil de leur lecture.'
            fix: 'Réserver la place des images, publicités et polices (attributs width/height, font-display: swap).'
        bytes:
            title: 'La page d’accueil pèse %mb% Mo'
            text: 'Avec une connexion mobile, cela prend plusieurs secondes et consomme du forfait de données.'
            fix: 'Compresser les images et les vidéos ; ne charger les vidéos que lorsqu’elles deviennent visibles.'
        console:
            title: '%count% erreurs dans la console du navigateur'
            text: 'Des erreurs JavaScript indiquent des fonctions défectueuses sur lesquelles les visiteurs peuvent tomber.'
            fix: 'Faire vérifier les erreurs par le développeur web ; il s’agit généralement de plugins obsolètes.'
    good:
        lcp:
            title: 'Rapide sur téléphone'
            text: 'Le contenu principal est visible après %lcp% s — sous les 2,5 s attendues par Google. C’est la base qui manque à beaucoup de sites.'
        cls:
            title: 'Rien ne saute'
            text: 'La mise en page reste stable pendant le chargement ; les visiteurs peuvent lire et cliquer tout de suite.'
        https:
            title: 'HTTPS correctement configuré'
            text: 'Connexion chiffrée avec un certificat valide ; le simple http redirige vers https.'
        console:
            title: 'Aucune erreur dans le navigateur'
            text: 'La console du navigateur est propre — aucun script défectueux.'
        images:
            title: 'Images livrées correctement'
            text: 'Formats modernes et tailles adaptées au téléphone comme à l’ordinateur.'

# ---------------------------------------------------------------- accessibility
a11y:
    summary:
        good: 'Sans obstacle lors des tests automatiques : les textes sont lisibles, les éléments de commande sont nommés.'
        ok: 'Globalement correct. %count% problèmes de contraste et quelques libellés manquants empêchent une très bonne note.'
        bad: 'Plusieurs obstacles : %count% problèmes de contraste, libellés ou descriptions manquants. Cela gêne aussi les visiteurs sans handicap.'
    meta: 'Accessibilité Lighthouse %score% sur 100 · %count% problèmes de contraste'
    issue:
        meta_viewport:
            title: 'Le zoom est bloqué sur téléphone'
            text: 'La page empêche le zoom à deux doigts. Les personnes malvoyantes ne peuvent pas agrandir le texte.'
            fix: 'Retirer user-scalable=no et maximum-scale de la balise viewport dans l’en-tête de la page, une ligne dans le template.'
        color_contrast:
            title: 'Texte avec un contraste insuffisant (%count%×)'
            text: 'Un texte clair sur fond clair ou foncé sur fond foncé est difficile à lire en plein soleil et pour environ un homme sur douze (perception des couleurs). Exigence : 4,5:1.'
            fix: 'Foncer légèrement la couleur du texte ou du fond — généralement une seule valeur de couleur dans la feuille de style, sans refonte.'
        image_alt:
            title: '%count% images sans description'
            text: 'Les lecteurs d’écran et Google ne savent pas ce que montrent ces images.'
            fix: 'Ajouter un court texte alternatif (alt) à chaque image de contenu ; les images décoratives reçoivent un attribut alt vide.'
        link_name:
            title: '%count% liens sans nom lisible'
            text: 'Des liens comme « en savoir plus » ou composés uniquement d’une icône ne disent rien aux utilisateurs de lecteurs d’écran.'
            fix: 'Donner à chaque lien un texte qui indique où il mène, ou un aria-label pour les liens à icône.'
        button_name:
            title: '%count% boutons sans nom'
            text: 'Les boutons à icône sans libellé ne peuvent pas être utilisés avec un lecteur d’écran.'
            fix: 'Ajouter un aria-label à chaque bouton à icône (p. ex. « Ouvrir le menu »).'
        html_has_lang:
            title: 'Langue de la page non déclarée'
            text: 'Sans attribut de langue, les lecteurs d’écran choisissent une mauvaise prononciation.'
            fix: 'Définir lang="en" (ou votre langue) sur l’élément <html>.'
        heading_order:
            title: 'Les titres sautent des niveaux'
            text: 'Des niveaux de titre sont sautés (h1 → h3) : la structure devient confuse pour les technologies d’assistance.'
            fix: 'Utiliser les niveaux de titre dans l’ordre ; les mettre en forme avec le CSS plutôt que de choisir un niveau pour son apparence.'
        label:
            title: '%count% champs de formulaire sans libellé'
            text: 'Les champs sans libellé visible et associé sont difficiles à remplir et ne sont pas reconnus par le remplissage automatique des navigateurs.'
            fix: 'Donner à chaque champ un <label for> qui correspond à l’id du champ.'
        target_size:
            title: '%count% zones tactiles trop petites'
            text: 'Les liens ou boutons de moins de 24 px se ratent facilement avec le pouce.'
            fix: 'Agrandir la zone cliquable (padding) à au moins 44 × 44 px.'
        label_content_name_mismatch:
            title: '%count% éléments dont le nom vocal diffère du libellé'
            text: 'Des boutons à icône (recherche, flèches, appel) portent un nom accessible qui ne correspond pas au texte visible : la commande vocale et les lecteurs d’écran annoncent autre chose.'
            fix: 'Faire commencer l’aria-label par le texte visible, ou utiliser le texte de l’icône comme nom.'
    good:
        contrast:
            title: 'Les contrastes sont bons'
            text: 'Chaque texte vérifié atteint le rapport de contraste exigé.'
        images:
            title: 'Les images sont décrites'
            text: 'Les %count% images des pages analysées ont toutes un texte alternatif.'
        lang:
            title: 'Langue déclarée'
            text: 'Les lecteurs d’écran lisent la page dans la bonne langue.'
        names:
            title: 'Liens et boutons nommés'
            text: 'Chaque élément de commande a un nom lisible ; les niveaux de titre sont dans l’ordre.'
        targets:
            title: 'Zones tactiles assez grandes'
            text: 'Les boutons et les liens peuvent être touchés avec le pouce.'

# ---------------------------------------------------------------- seo
seo:
    summary:
        good: 'Titres, descriptions, intertitres et données structurées sont propres. Google peut lire le site.'
        ok: 'Les bases sont là ; quelques titres, descriptions ou détails de structure méritent d’être revus.'
        bad: 'Des bases importantes pour Google manquent. Les moteurs de recherche trouvent le site, mais comprennent à peine de quoi il parle.'
    meta: 'SEO Lighthouse %score% sur 100 · %pages% pages analysées'
    issue:
        title_missing:
            title: 'Pas de titre de page sur %page%'
            text: 'Le titre est le gros titre affiché dans les résultats Google. S’il manque, Google en invente un.'
            fix: 'Rédiger un titre de 60 caractères maximum : ce que vous proposez, et où (p. ex. « Dentiste à Lyon – Dr Exemple »).'
        title_long:
            title: 'Titre de page trop long sur %page%'
            text: '%length% caractères — Google coupe les titres au-delà d’environ 60.'
            fix: 'Raccourcir le titre ; les mots les plus importants en premier.'
        desc_missing:
            title: 'Pas de description sur %page%'
            text: 'La meta description est le texte gris sous le résultat Google. Si elle manque, Google affiche un extrait au hasard.'
            fix: 'Rédiger 140–158 caractères qui disent ce que propose la page et pourquoi cliquer.'
        desc_long:
            title: 'Description trop longue sur %page%'
            text: '%length% caractères — Google coupe les descriptions au-delà d’environ 160.'
            fix: 'Raccourcir à 140–158 caractères.'
        h1_missing:
            title: 'Pas de titre principal sur %page%'
            text: 'Chaque page a besoin d’exactement un titre H1 qui nomme le sujet.'
            fix: 'Faire du titre le plus important un H1.'
        h1_multiple:
            title: '%count% titres principaux sur %page%'
            text: 'Plusieurs titres H1 brouillent le sujet de la page.'
            fix: 'Garder un seul H1 par page ; transformer les autres en H2.'
        noindex:
            title: 'Page d’accueil bloquée pour Google'
            text: 'La page d’accueil porte une instruction « noindex » : Google est prié de ne pas la référencer.'
            fix: 'Retirer le réglage noindex dans le CMS (généralement une case à cocher sur la page).'
        heading_skips:
            title: 'Niveaux de titre sautés (%count%×)'
            text: 'Des sauts comme H1 → H3 rendent la structure peu claire pour Google et les lecteurs d’écran.'
            fix: 'Utiliser les niveaux de titre dans l’ordre.'
        sitemap_missing:
            title: 'Aucun plan du site trouvé'
            text: 'Un fichier sitemap.xml indique d’un coup toutes les pages à Google ; sans lui, les nouvelles pages sont trouvées plus tard.'
            fix: 'Activer le plan du site dans le CMS et l’indiquer dans le robots.txt.'
        schema:
            title: 'Aucune donnée structurée'
            text: 'Les données structurées (schema.org) indiquent à Google et aux assistants IA de quel type d’entreprise il s’agit, où elle se trouve et quand elle est ouverte.'
            fix: 'Ajouter des données Organization ou LocalBusiness avec nom, adresse, téléphone et horaires d’ouverture (la plupart des CMS ont un plugin pour cela).'
        not_crawlable:
            title: 'Page bloquée pour les moteurs de recherche'
            text: 'Des instructions robots empêchent Google d’indexer la page.'
            fix: 'Vérifier le robots.txt et la balise meta robots ; lever le blocage pour les pages publiques.'
        link_text:
            title: '%count% liens au texte peu parlant'
            text: '« Cliquez ici » ou « plus » ne dit rien à Google sur la page de destination.'
            fix: 'Utiliser des textes de lien descriptifs (« nos horaires d’ouverture »).'
        crawlable_anchors:
            title: 'Liens que Google ne peut pas suivre'
            text: 'Certains liens sont construits uniquement en JavaScript et sont invisibles pour les moteurs de recherche.'
            fix: 'Utiliser des liens <a href> normaux pour la navigation.'
        canonical:
            title: 'Lien canonique incorrect'
            text: 'La balise canonical pointe vers une adresse erronée ou inaccessible, ce qui peut induire Google en erreur.'
            fix: 'Faire pointer le lien canonique vers la page elle-même.'
        hreflang:
            title: 'Liens de langue incorrects'
            text: 'Les balises hreflang des versions linguistiques contiennent des erreurs.'
            fix: 'Faire corriger les balises hreflang (codes de langue valides, toutes les versions se référencent mutuellement).'
        http_redirect:
            title: 'http ne redirige pas vers https'
            text: 'Les visiteurs qui saisissent l’adresse sans https arrivent sur la version non chiffrée.'
            fix: 'Mettre en place une redirection permanente de http vers https sur le serveur.'
    good:
        sitemap:
            title: 'Plan du site présent'
            text: '%count% pages sont répertoriées pour Google.'
        titles:
            title: 'Titres et descriptions définis'
            text: 'Chaque page analysée a son propre titre et sa propre description, de longueur adaptée.'
        h1:
            title: 'Un titre principal par page'
            text: 'Une structure claire pour Google et pour les visiteurs.'
        schema:
            title: 'Données structurées présentes'
            text: 'Google et les assistants IA trouvent des données %types%.'
        https:
            title: 'Chiffré et redirigé'
            text: 'https avec redirection depuis http.'

# ---------------------------------------------------------------- AI visibility
ai:
    summary:
        good: 'Les assistants IA peuvent lire et comprendre le site ; un résumé (llms.txt) est en place.'
        ok: 'Les assistants IA peuvent lire le site, mais doivent reconstituer eux-mêmes ce que vous proposez.'
        bad: 'Les moteurs de recherche IA voient à peine le site : pas de résumé, robots bloqués ou aucune donnée d’entreprise identifiable.'
    meta: 'llms.txt : %llms% · %blocked% robots IA bloqués'
    issue:
        llms_missing:
            title: 'Pas de llms.txt'
            text: 'ChatGPT, Perplexity et l’IA de Google cherchent un court fichier texte qui dit ce que fait l’entreprise, pour qui et où. Sans lui, ils devinent à partir des pages.'
            fix: 'Créer /llms.txt : trois paragraphes (offre, public cible, lieu/contact) plus des liens vers les pages clés. Une demi-heure de travail.'
        bots_blocked:
            title: 'Robots IA bloqués : %bots%'
            text: 'Le robots.txt interdit à ces assistants de lire le site : ils ne peuvent donc pas le recommander.'
            fix: 'Autoriser ces robots dans le robots.txt — ou décider sciemment de rester absent des réponses IA.'
        no_identity_schema:
            title: 'Entreprise non lisible par les machines'
            text: 'Sans données Organization/LocalBusiness, un assistant ne connaît pas de façon fiable le nom, l’adresse ou les horaires d’ouverture.'
            fix: 'Ajouter des données structurées avec nom, adresse, téléphone, horaires d’ouverture et zone desservie.'
        offer_unclear:
            title: 'L’offre n’apparaît pas dans les premières phrases'
            text: 'Les réponses des IA citent les premières phrases d’une page. Sur la page d’accueil, elles n’énoncent pas clairement l’offre.'
            fix: 'Commencer la page par une phrase simple : qui vous êtes, ce que vous faites, pour qui, où.'
    good:
        llms:
            title: 'llms.txt présent'
            text: 'Les assistants IA obtiennent un résumé directement de votre part.'
        bots:
            title: 'Robots IA autorisés'
            text: 'GPTBot, ClaudeBot, PerplexityBot et Google-Extended peuvent lire le site.'
        schema:
            title: 'Entreprise lisible par les machines'
            text: 'Des données structurées de type %types% identifient l’entreprise.'
        offer:
            title: 'Offre annoncée d’emblée'
            text: 'Les premières phrases disent déjà ce que fait l’entreprise.'

# ---------------------------------------------------------------- content
content:
    summary:
        good: 'En cinq secondes, on comprend ce que fait l’entreprise, pour qui, et quelle est l’étape suivante.'
        ok: 'Compréhensible, mais l’offre ou l’étape suivante pourrait être plus claire ; certains termes supposent des connaissances préalables.'
        bad: 'Les visiteurs ne comprennent pas rapidement ce qui est proposé ni comment prendre contact. Cela coûte des demandes.'
    meta:
        ai: 'Une IA a lu %pages% pages comme un visiteur qui découvre le site'
        heuristic: 'Vérification heuristique (aucune IA configurée)'
    issue:
        no_cta:
            title: 'Pas d’étape suivante claire'
            text: 'Les visiteurs intéressés ne voient pas au premier coup d’œil comment appeler, demander un devis ou réserver.'
            fix: 'Placer une action bien visible dès le premier écran : « Appeler », « Demander un devis » ou « Réserver » — avec le numéro de téléphone.'
        thin:
            title: 'Très peu de texte (%words% mots)'
            text: 'Avec si peu de texte, ni les visiteurs ni Google n’apprennent ce que vous proposez.'
            fix: 'Décrire l’offre, le public cible et le lieu en deux ou trois courts paragraphes.'
        phone:
            title: 'Numéro de téléphone non cliquable'
            text: 'Sur téléphone, un numéro devrait pouvoir être touché pour appeler (lien tel:). Ici, il manque ou n’est que du texte.'
            fix: 'Lier le numéro avec tel:+43… ; le placer dans l’en-tête ou le pied de page de chaque page.'
    good:
        cta:
            title: 'Étape suivante claire'
            text: 'Les visiteurs voient comment prendre contact.'
        length:
            title: 'Suffisamment de texte'
            text: '%words% mots décrivent l’offre.'
        phone:
            title: 'Numéro de téléphone cliquable'
            text: 'Un simple toucher sur le téléphone lance l’appel.'

# ---------------------------------------------------------------- legal
legal:
    summary:
        good: 'Mentions légales, politique de confidentialité et gestion du consentement sont en place, pour autant que cela se vérifie techniquement.'
        ok: 'Mentions légales et politique de confidentialité existent ; la gestion des services tiers mérite d’être revue.'
        bad: 'Mentions légales ou politique de confidentialité manquantes, ou des services de suivi se chargent avant le consentement. Veuillez faire vérifier par votre conseiller juridique.'
    meta: 'Vérification technique, pas un conseil juridique'
    note: 'Il s’agit d’une vérification technique : elle recherche les pages et les services chargés avant tout consentement. Ce n’est pas un conseil juridique — veuillez faire vérifier les détails par votre conseiller juridique.'
    issue:
        imprint:
            title: 'Mentions légales introuvables'
            text: 'Aucun lien vers une page de mentions légales n’a été trouvé sur les pages analysées, ou la page est inaccessible.'
            fix: 'Lier une page de mentions légales depuis chaque page (pied de page), avec les informations obligatoires.'
        privacy:
            title: 'Politique de confidentialité introuvable'
            text: 'Aucun lien vers une politique de confidentialité n’a été trouvé, ou la page est inaccessible.'
            fix: 'Lier la politique de confidentialité depuis chaque page (pied de page) ; elle doit citer chaque service utilisé.'
        tracking:
            title: 'Suivi avant consentement : %services%'
            text: 'Ces services se chargent dès la première visite, avant que le visiteur ait pu donner son consentement. Selon le RGPD et les règles ePrivacy, un consentement préalable est nécessaire.'
            fix: 'Ne charger ces services qu’après consentement dans le bandeau cookies (ou configurer l’outil de consentement pour qu’il les bloque).'
        embeds:
            title: 'Services tiers sans outil de consentement : %services%'
            text: 'Des services externes se chargent sans bandeau de consentement. Selon le service, un consentement peut être nécessaire.'
            fix: 'Héberger les polices localement ; charger les cartes et vidéos après un clic ou via l’outil de consentement.'
    good:
        imprint:
            title: 'Mentions légales présentes'
            text: 'Liées et accessibles.'
        privacy:
            title: 'Politique de confidentialité présente'
            text: 'Liée et accessible.'
        no_third_party:
            title: 'Aucun service tiers avant consentement'
            text: 'Rien d’externe ne se charge lors de la première visite.'
        cmp:
            title: 'Outil de consentement présent'
            text: 'Un bandeau cookies / outil de consentement a été trouvé.'

# ---------------------------------------------------------------- mobile
mobile:
    summary:
        good: 'S’adapte à l’écran du téléphone ; les boutons et le texte sont assez grands.'
        ok: 'Utilisable sur téléphone ; quelques zones tactiles ou tailles de police sont trop petites.'
        bad: 'Difficile à utiliser sur téléphone : pas de réglage viewport, zones tactiles trop petites ou contenu plus large que l’écran.'
        unknown: 'N’a pas pu être entièrement mesuré (pas de résultat PageSpeed).'
    meta: 'Viewport, zones tactiles, taille de police, largeur du contenu'
    issue:
        viewport:
            title: 'Pas de viewport mobile'
            text: 'Sur téléphone, la page s’affiche comme une page d’ordinateur en miniature.'
            fix: 'Ajouter <meta name="viewport" content="width=device-width, initial-scale=1"> dans l’en-tête de la page.'
        targets:
            title: '%count% zones tactiles trop petites'
            text: 'Des liens ou boutons sont trop petits ou trop rapprochés pour le pouce.'
            fix: 'Agrandir la zone tactile à au moins 44 × 44 px et espacer les liens.'
        font:
            title: 'Texte trop petit sur téléphone'
            text: '%value% du texte fait moins de 12 px et se lit difficilement sur téléphone.'
            fix: 'Utiliser au moins 16 px pour le texte courant.'
        width:
            title: 'Contenu plus large que l’écran'
            text: 'Les visiteurs doivent faire défiler la page latéralement.'
            fix: 'Corriger les éléments à largeur fixe (tableaux, images, contenus intégrés) avec max-width: 100 %.'
    good:
        viewport:
            title: 'Viewport mobile défini'
            text: 'La page s’adapte à l’écran du téléphone.'
        targets:
            title: 'Zones tactiles correctes'
            text: 'Les liens et boutons peuvent être touchés avec le pouce.'
        font:
            title: 'Texte lisible'
            text: 'Les tailles de police sont suffisantes pour les téléphones.'

# ---------------------------------------------------------------- front end
fe:
