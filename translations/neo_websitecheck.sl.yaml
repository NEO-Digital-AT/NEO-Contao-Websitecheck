# NEO Website Check — Slovenian texts (front end, report, e-mail).
# Copy to translations/neo_websitecheck.sl.yaml in your project to override single keys.
word:
    yes: 'da'
    no: 'ne'
    none: 'brez'
grade:
    1: 'Zelo dobro'
    2: 'Dobro'
    3: 'Zadovoljivo'
    4: 'Zadostno'
    5: 'Nezadostno'
verdict:
    good: 'Solidna spletna stran. Nič nujnega, nekaj malenkosti bi jo naredilo še boljšo.'
    mid: 'Solidna osnova, vendar vas nekatere točke verjetno stanejo povpraševanj. Najpomembnejše so navedene spodaj.'
    low: 'Jasna potreba po ukrepanju. Začnite s tremi spodnjimi ukrepi, nato bo spletna stran postala orodje, ki pripelje stranke.'
area:
    speed: 'Hitrost nalaganja'
    accessibility: 'Dostopnost'
    seo: 'Najdljivost v Googlu'
    ai: 'Vidnost v iskanju z AI'
    content: 'Vsebina in jasnost'
    legal: 'Pravno in zasebnost'
    mobile: 'Mobilno'
    unavailable: 'Tokrat ni bilo mogoče izmeriti.'
measure:
    effort:
        small: 'majhen trud'
        medium: 'srednji trud'
        large: 'velik trud'

# ---------------------------------------------------------------- speed
speed:
    summary:
        good: 'Začetna stran je na telefonu vidna po %lcp% s. To je hitreje kot pri večini spletnih strani.'
        ok: 'Začetna stran na telefonu potrebuje %lcp% s. Uporabno, vendar nekateri obiskovalci odidejo, preden je pripravljena.'
        bad: 'Začetna stran na telefonu potrebuje %lcp% s. Veliko obiskovalcev odide, preden se karkoli prikaže.'
    meta: 'Zmogljivost %perf% od 100 · LCP %lcp% s · CLS %cls%'
    kpi:
        lcp: 'Glavna vsebina vidna (LCP)'
        lcp_note: 'meja 2,5 s'
        cls: 'Premiki postavitve (CLS)'
        cls_note: 'meja 0,1'
        tbt: 'Blokiran čas (TBT)'
        tbt_note: 'meja 200 ms'
        inp: 'Odziv na dotik (INP)'
        inp_note: 'meja 200 ms'
        perf: 'Ocena zmogljivosti'
        perf_note: 'od 100'
        bytes: 'Velikost strani'
        bytes_note: 'meja 2 MB'
        requests: 'Zahteve'
        requests_note: 'meja 80'
    issue:
        lcp:
            title: 'Začetna stran se na telefonih nalaga počasi'
            text: 'Glavna vsebina se prikaže po %lcp% sekundah. Google postavlja mejo pri 2,5 sekunde; obiskovalci presodijo še prej.'
            fix: 'Zmanjšajte največjo sliko v vidnem delu, skripte naložite pozneje in naj strežnik pošilja stisnjene datoteke. Običajno ena do dve uri dela.'
        largest_image:
            title: 'Ena slika tehta %kb% KB'
            text: 'Datoteka „%file%“ je najtežji element začetne strani in zavira vse, kar pride za njo.'
            fix: 'Sliko izvozite v prikazani širini (običajno 1200–1600 px) kot WebP ali AVIF. Pogosto je 80 % manjša brez vidne razlike.'
        render_blocking:
            title: '%count% datotek blokira prvi prikaz'
            text: 'Slogovne datoteke ali skripte v glavi strani se v celoti naložijo, preden se karkoli prikaže.'
            fix: 'Nekritični CSS in JavaScript nalagajte z zamikom ali asinhrono; v glavi pustite le ključne sloge.'
        image_formats:
            title: 'Slike v starih formatih'
            text: 'JPEG/PNG, kjer bi bil WebP ali AVIF za 30–70 % manjši.'
            fix: 'Naj CMS samodejno dostavlja sodobne formate (večina sistemov to omogoča z eno nastavitvijo).'
        responsive_images:
            title: 'Slike so večje od prikaza'
            text: 'Telefoni prenašajo slike v velikosti za namizje in jih nato pomanjšajo.'
            fix: 'Slike pripravite v več velikostih (srcset); CMS jih običajno lahko ustvari sam.'
        unused_js:
            title: 'Neuporabljen JavaScript'
            text: 'Naložijo se skripte, ki jih ta stran ne uporablja. Stanejo čas in baterijo.'
            fix: 'Odstranite neuporabljene vtičnike in sledilne skripte; ostalo naložite le na straneh, ki to potrebujejo.'
        ttfb:
            title: 'Strežnik se odziva počasi'
            text: 'Strežnik potrebuje %value%, da pošlje prvi bajt, preden brskalnik sploh lahko kaj naredi.'
            fix: 'V CMS vklopite predpomnjenje strani ali pri ponudniku gostovanja vprašajte za hitrejši paket.'
        compression:
            title: 'Datoteke se pošiljajo nestisnjene'
            text: 'Besedilne datoteke (HTML, CSS, JavaScript) na poti do brskalnika niso stisnjene.'
            fix: 'Na strežniku vklopite stiskanje gzip ali Brotli (ena vrstica v konfiguraciji strežnika).'
        cls:
            title: 'Vsebina med nalaganjem skače (CLS %cls%)'
            text: 'Elementi se premaknejo, ko so že prikazani, zato obiskovalci kliknejo napačno stvar ali izgubijo mesto branja.'
            fix: 'Rezervirajte prostor za slike, oglase in pisave (atributa width/height, font-display: swap).'
        bytes:
            title: 'Začetna stran tehta %mb% MB'
            text: 'Na mobilni povezavi to traja več sekund in porablja prenos podatkov.'
            fix: 'Stisnite slike in videoposnetke; videoposnetke naložite šele, ko so vidni.'
        console:
            title: '%count% napak v konzoli brskalnika'
            text: 'Napake JavaScripta kažejo na nedelujoče funkcije, na katere lahko naletijo obiskovalci.'
            fix: 'Naj napake preveri spletni razvijalec; običajno gre za zastarele vtičnike.'
    good:
        lcp:
            title: 'Hitra na telefonih'
            text: 'Glavna vsebina je vidna po %lcp% s — pod 2,5 s, ki jih pričakuje Google. To je osnova, ki manjka mnogim spletnim stranem.'
        cls:
            title: 'Nič ne skače'
            text: 'Postavitev med nalaganjem ostane stabilna; obiskovalci lahko takoj berejo in klikajo.'
        https:
            title: 'HTTPS pravilno nastavljen'
            text: 'Šifrirana povezava z veljavnim certifikatom; navaden http preusmeri na https.'
        console:
            title: 'Brez napak v brskalniku'
            text: 'Konzola brskalnika je čista — brez nedelujočih skript.'
        images:
            title: 'Slike so dostavljene pravilno'
            text: 'Sodobni formati in ustrezne velikosti za telefon in namizje.'

# ---------------------------------------------------------------- accessibility
a11y:
    summary:
        good: 'Brez ovir v samodejnih testih: besedila so berljiva, upravljalni elementi so označeni.'
        ok: 'Večinoma v redu. %count% ugotovitev glede kontrasta in nekaj oznak preprečuje najvišjo oceno.'
        bad: 'Več ovir: %count% ugotovitev glede kontrasta, manjkajoče oznake ali opisi. To moti tudi običajne obiskovalce.'
    meta: 'Dostopnost po Lighthouse %score% od 100 · %count% ugotovitev glede kontrasta'
    issue:
        meta_viewport:
            title: 'Povečava na telefonih je blokirana'
            text: 'Stran preprečuje povečavo s prsti. Slabovidni ne morejo povečati besedila.'
            fix: 'Iz oznake viewport v glavi strani odstranite user-scalable=no in maximum-scale, ena vrstica v predlogi.'
        color_contrast:
            title: 'Besedilo s premajhnim kontrastom (%count%×)'
            text: 'Svetlo besedilo na svetlem ozadju ali temno na temnem je težko berljivo na soncu in za približno vsakega dvanajstega moškega (barvni vid). Zahtevano: 4,5 : 1.'
            fix: 'Barvo besedila ali ozadje nekoliko potemnite — običajno ena barvna vrednost v slogovni datoteki, brez prenove.'
        image_alt:
            title: '%count% slik brez opisa'
            text: 'Bralniki zaslona in Google ne vedo, kaj te slike prikazujejo.'
            fix: 'Vsaki vsebinski sliki dodajte kratko besedilo alt; okrasne slike dobijo prazen atribut alt.'
        link_name:
            title: '%count% povezav brez berljivega imena'
            text: 'Povezave, kot je „preberi več“, ali povezave samo z ikono uporabnikom bralnikov zaslona ne povedo ničesar.'
            fix: 'Vsaki povezavi dajte besedilo, ki pove, kam vodi, ali aria-label za povezave z ikonami.'
        button_name:
            title: '%count% gumbov brez imena'
            text: 'Gumbov z ikono brez oznake uporabniki bralnikov zaslona ne morejo uporabljati.'
            fix: 'Vsakemu gumbu z ikono dodajte aria-label (npr. „Odpri meni“).'
        html_has_lang:
            title: 'Jezik strani ni naveden'
            text: 'Brez atributa jezika bralniki zaslona izberejo napačno izgovorjavo.'
            fix: 'Na elementu <html> nastavite lang="sl" (ali vaš jezik).'
        heading_order:
            title: 'Naslovi preskakujejo ravni'
            text: 'Ravni naslovov (h1 → h3) so preskočene, zato je zgradba za podporne tehnologije nejasna.'
            fix: 'Ravni naslovov uporabljajte po vrsti; oblikujte jih s CSS, namesto da raven izberete zaradi videza.'
        label:
            title: '%count% polj obrazca brez oznake'
            text: 'Polja brez vidne, povezane oznake je težko izpolniti in jih samodejno izpolnjevanje brskalnikov zavrne.'
            fix: 'Vsakemu polju dodajte <label for>, ki se ujema z ID-jem polja.'
        target_size:
            title: '%count% premajhnih ciljev za dotik'
            text: 'Povezave ali gumbe, manjše od 24 px, s palcem zlahka zgrešite.'
            fix: 'Povečajte območje za klik (padding) na vsaj 44 × 44 px.'
        label_content_name_mismatch:
            title: '%count% upravljalnih elementov, katerih izgovorjeno ime se razlikuje od oznake'
            text: 'Gumbi z ikono (iskanje, puščice, klic) imajo dostopno ime, ki se ne ujema z vidnim besedilom, zato glasovno upravljanje in bralniki zaslona napovedo nekaj drugega.'
            fix: 'Naj se aria-label začne z vidnim besedilom ali pa naj bo besedilo ikone kar ime.'
    good:
        contrast:
            title: 'Kontrasti so v redu'
            text: 'Vsako preverjeno besedilo doseže zahtevano razmerje kontrasta.'
        images:
            title: 'Slike so opisane'
            text: 'Vseh %count% slik na preverjenih straneh ima nadomestno besedilo.'
        lang:
            title: 'Jezik je naveden'
            text: 'Bralniki zaslona berejo stran v pravem jeziku.'
        names:
            title: 'Povezave in gumbi imajo imena'
            text: 'Vsak upravljalni element ima berljivo ime; ravni naslovov so po vrsti.'
        targets:
            title: 'Cilji za dotik so dovolj veliki'
            text: 'Gumbe in povezave je mogoče zadeti s palcem.'

# ---------------------------------------------------------------- seo
seo:
    summary:
        good: 'Naslovi, opisi, podnaslovi in strukturirani podatki so urejeni. Google lahko prebere stran.'
        ok: 'Osnove so prisotne; nekatere naslove, opise ali podrobnosti zgradbe se splača urediti.'
        bad: 'Manjkajo pomembne osnove za Google. Iskalniki stran najdejo, vendar komaj vedo, o čem govori.'
    meta: 'SEO po Lighthouse %score% od 100 · preverjenih strani: %pages%'
    issue:
        title_missing:
            title: 'Na strani %page% ni naslova strani'
            text: 'Naslov je naslovna vrstica v Googlovih rezultatih. Brez njega si ga Google izmisli sam.'
            fix: 'Napišite naslov z največ 60 znaki: kaj ponujate in kje (npr. „Zobozdravnik v Mariboru – dr. Primer“).'
        title_long:
            title: 'Naslov strani na %page% je predolg'
            text: '%length% znakov — Google naslove odreže po približno 60.'
            fix: 'Skrajšajte naslov; najpomembnejše besede naj bodo na začetku.'
        desc_missing:
            title: 'Na strani %page% ni opisa'
            text: 'Meta opis je sivo besedilo pod Googlovim rezultatom. Če manjka, Google prikaže naključen izsek.'
            fix: 'Napišite 140–158 znakov, ki povedo, kaj stran ponuja in zakaj naj nekdo klikne.'
        desc_long:
            title: 'Opis na %page% je predolg'
            text: '%length% znakov — Google opise odreže po približno 160.'
            fix: 'Skrajšajte na 140–158 znakov.'
        h1_missing:
            title: 'Na strani %page% ni glavnega naslova'
            text: 'Vsaka stran potrebuje natanko en H1, ki poimenuje temo.'
            fix: 'Najpomembnejši naslov naj bo H1.'
        h1_multiple:
            title: '%count% glavnih naslovov na %page%'
            text: 'Več naslovov H1 zabriše, o čem stran govori.'
            fix: 'Na vsaki strani obdržite en H1; ostale naj bodo H2.'
        noindex:
            title: 'Začetna stran je za Google blokirana'
            text: 'Začetna stran vsebuje navodilo „noindex“: Googlu sporoča, naj je ne navaja.'
            fix: 'V CMS odstranite nastavitev noindex (običajno potrditveno polje pri strani).'
        heading_skips:
            title: 'Preskočene ravni naslovov (%count%×)'
            text: 'Skoki, kot je H1 → H3, naredijo zgradbo nejasno za Google in bralnike zaslona.'
            fix: 'Ravni naslovov uporabljajte po vrsti.'
        sitemap_missing:
            title: 'Zemljevid strani ni bil najden'
            text: 'Datoteka sitemap.xml Googlu naenkrat sporoči vse strani; brez nje so nove strani najdene pozneje.'
            fix: 'V CMS vklopite zemljevid strani in ga navedite v robots.txt.'
        schema:
            title: 'Ni strukturiranih podatkov'
            text: 'Strukturirani podatki (schema.org) Googlu in AI-asistentom povedo, za kakšno podjetje gre, kje je in kdaj je odprto.'
            fix: 'Dodajte podatke Organization ali LocalBusiness z imenom, naslovom, telefonom in delovnim časom (večina CMS ima za to vtičnik).'
        not_crawlable:
            title: 'Stran je za iskalnike blokirana'
            text: 'Navodila za robote preprečujejo, da bi Google stran indeksiral.'
            fix: 'Preverite robots.txt in meta oznako robots; za javne strani odstranite blokado.'
        link_text:
            title: '%count% povezav z nepovednim besedilom'
            text: '„Kliknite tukaj“ ali „več“ Googlu ne pove ničesar o ciljni strani.'
            fix: 'Uporabljajte opisna besedila povezav („naš delovni čas“).'
        crawlable_anchors:
            title: 'Povezave, ki jim Google ne more slediti'
            text: 'Nekatere povezave so zgrajene samo z JavaScriptom in so za iskalnike nevidne.'
            fix: 'Za navigacijo uporabljajte običajne povezave <a href>.'
        canonical:
            title: 'Kanonična povezava je napačna'
            text: 'Oznaka canonical kaže na napačen ali nedosegljiv naslov, kar lahko zmede Google.'
            fix: 'Kanonična povezava naj kaže na stran samo.'
        hreflang:
            title: 'Jezikovne povezave so napačne'
            text: 'Oznake hreflang za jezikovne različice vsebujejo napake.'
            fix: 'Naj se oznake hreflang popravijo (veljavne jezikovne kode, vse različice se sklicujejo druga na drugo).'
        http_redirect:
            title: 'http ne preusmeri na https'
            text: 'Obiskovalci, ki naslov vtipkajo brez https, pristanejo na nešifrirani različici.'
            fix: 'Na strežniku dodajte trajno preusmeritev s http na https.'
    good:
        sitemap:
            title: 'Zemljevid strani obstaja'
            text: 'Za Google je navedenih %count% strani.'
        titles:
            title: 'Naslovi in opisi so nastavljeni'
            text: 'Vsaka preverjena stran ima svoj naslov in opis ustrezne dolžine.'
        h1:
            title: 'En glavni naslov na stran'
            text: 'Jasna zgradba za Google in obiskovalce.'
        schema:
            title: 'Strukturirani podatki obstajajo'
            text: 'Google in AI-asistenti najdejo podatke %types%.'
        https:
            title: 'Šifrirano in preusmerjeno'
            text: 'https s preusmeritvijo s http.'

# ---------------------------------------------------------------- AI visibility
ai:
    summary:
        good: 'AI-asistenti lahko stran preberejo in razumejo; povzetek (llms.txt) je na voljo.'
        ok: 'AI-asistenti smejo stran brati, vendar morajo sami sestaviti, kaj ponujate.'
        bad: 'AI-iskalniki stran komaj vidijo: ni povzetka, pajki so blokirani ali ni prepoznavnih podatkov o podjetju.'
    meta: 'llms.txt: %llms% · blokiranih AI-pajkov: %blocked%'
    issue:
        llms_missing:
            title: 'Ni datoteke llms.txt'
            text: 'ChatGPT, Perplexity in Googlova AI iščejo kratko besedilno datoteko, ki pove, kaj podjetje počne, za koga in kje. Brez nje ugibajo na podlagi strani.'
            fix: 'Ustvarite /llms.txt: trije odstavki (ponudba, ciljna skupina, lokacija/kontakt) in povezave na ključne strani. Pol ure dela.'
        bots_blocked:
            title: 'Blokirani AI-pajki: %bots%'
            text: 'robots.txt tem asistentom prepoveduje branje strani, zato je ne morejo priporočiti.'
            fix: 'V robots.txt dovolite te pajke — ali pa se zavestno odločite, da ostanete zunaj odgovorov AI.'
        no_identity_schema:
            title: 'Podjetje ni strojno berljivo'
            text: 'Brez podatkov Organization/LocalBusiness asistent ne pozna zanesljivo imena, naslova ali delovnega časa.'
            fix: 'Dodajte strukturirane podatke z imenom, naslovom, telefonom, delovnim časom in območjem delovanja.'
        offer_unclear:
            title: 'Ponudbe ni v prvih stavkih'
            text: 'Odgovori AI navajajo prve stavke strani. Na začetni strani ti ne povedo jasno, kaj ponujate.'
            fix: 'Stran začnite z enim preprostim stavkom: kdo ste, kaj delate, za koga in kje.'
    good:
        llms:
            title: 'llms.txt obstaja'
            text: 'AI-asistenti dobijo povzetek neposredno od vas.'
        bots:
            title: 'AI-pajki so dovoljeni'
            text: 'GPTBot, ClaudeBot, PerplexityBot in Google-Extended smejo brati stran.'
        schema:
            title: 'Podjetje je strojno berljivo'
            text: 'Strukturirani podatki vrste %types% identificirajo podjetje.'
        offer:
            title: 'Ponudba je navedena zgodaj'
            text: 'Že prvi stavki povedo, kaj podjetje počne.'

# ---------------------------------------------------------------- content
content:
    summary:
        good: 'V petih sekundah je jasno, kaj podjetje počne, za koga in kaj storiti naprej.'
        ok: 'Razumljivo, vendar bi bila ponudba ali naslednji korak lahko jasnejša; nekateri izrazi predpostavljajo predznanje.'
        bad: 'Obiskovalci ne razumejo hitro, kaj je na voljo ali kako stopiti v stik. To stane povpraševanja.'
    meta:
        ai: 'AI je prebrala strani (%pages%) kot obiskovalec, ki jih vidi prvič'
        heuristic: 'Hevristično preverjanje (AI ni nastavljena)'
    issue:
        no_cta:
            title: 'Ni jasnega naslednjega koraka'
            text: 'Zainteresirani obiskovalci na prvi pogled ne vidijo, kako poklicati, povprašati ali rezervirati.'
            fix: 'Na prvi zaslon postavite eno vidno dejanje: „Pokličite“, „Zahtevajte ponudbo“ ali „Rezervirajte“ — s telefonsko številko.'
        thin:
            title: 'Zelo malo besedila (%words% besed)'
            text: 'Pri tako malo besedila niti obiskovalci niti Google ne izvedo, kaj ponujate.'
            fix: 'Ponudbo, ciljno skupino in lokacijo opišite v dveh ali treh kratkih odstavkih.'
        phone:
            title: 'Telefonske številke ni mogoče tapniti'
            text: 'Na telefonih naj bo številko mogoče tapniti (povezava tel:). Tukaj manjka ali je navadno besedilo.'
            fix: 'Telefonsko številko povežite s tel:+386…; postavite jo v glavo ali nogo vsake strani.'
    good:
        cta:
            title: 'Jasen naslednji korak'
            text: 'Obiskovalci vidijo, kako stopiti v stik.'
        length:
            title: 'Dovolj besedila'
            text: 'Ponudbo opisuje %words% besed.'
        phone:
            title: 'Telefonsko številko je mogoče tapniti'
            text: 'En dotik na telefonu sproži klic.'

# ---------------------------------------------------------------- legal
legal:
    summary:
        good: 'Pravno obvestilo, politika zasebnosti in upravljanje privolitev so urejeni, kolikor je mogoče tehnično preveriti.'
        ok: 'Pravno obvestilo in politika zasebnosti obstajata; ravnanje s storitvami tretjih oseb je treba preveriti.'
        bad: 'Pravno obvestilo ali politika zasebnosti manjka ali pa se sledilne storitve naložijo pred privolitvijo. Prosimo, preverite s svojim pravnim svetovalcem.'
    meta: 'Tehnično preverjanje, ne pravni nasvet'
    note: 'To je tehnično preverjanje: išče strani in storitve, ki se naložijo pred kakršno koli privolitvijo. Ni pravni nasvet — podrobnosti naj preveri vaš pravni svetovalec.'
    issue:
        imprint:
            title: 'Pravno obvestilo (kolofon) ni bilo najdeno'
            text: 'Na preverjenih straneh ni bilo najdene povezave na stran s pravnim obvestilom ali pa stran ni dosegljiva.'
            fix: 'Na vsaki strani (v nogi) povežite stran s pravnim obvestilom z obveznimi podatki.'
        privacy:
            title: 'Politika zasebnosti ni bila najdena'
            text: 'Ni bilo najdene povezave na politiko zasebnosti ali pa stran ni dosegljiva.'
            fix: 'Politiko zasebnosti povežite na vsaki strani (v nogi); navesti mora vse uporabljene storitve.'
        tracking:
            title: 'Sledenje pred privolitvijo: %services%'
            text: 'Te storitve se naložijo ob prvem obisku, še preden je obiskovalec lahko privolil. Po GDPR/TTDSG je za to potrebna predhodna privolitev.'
            fix: 'Te storitve naložite šele po privolitvi v pasici za piškotke (ali orodje za privolitev nastavite tako, da jih blokira).'
        embeds:
            title: 'Storitve tretjih oseb brez orodja za privolitev: %services%'
            text: 'Zunanje storitve se naložijo brez pasice za privolitev. Glede na storitev je lahko potrebna privolitev.'
