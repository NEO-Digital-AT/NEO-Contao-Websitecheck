# NEO Website Check — hrvatski tekstovi (front end, izvještaj, e-mail).
# Kopirajte u translations/neo_websitecheck.hr.yaml svojeg projekta kako biste nadjačali pojedine ključeve.
word:
    yes: 'da'
    no: 'ne'
    none: 'nema'
grade:
    1: 'Vrlo dobro'
    2: 'Dobro'
    3: 'Zadovoljavajuće'
    4: 'Dovoljno'
    5: 'Nedovoljno'
verdict:
    good: 'Solidna web-stranica. Ništa nije hitno, a nekoliko sitnica učinilo bi je još boljom.'
    mid: 'Dobra osnova, ali neke vas točke vjerojatno stoje upita. Najvažnije su navedene u nastavku.'
    low: 'Jasna potreba za djelovanjem. Počnite s tri mjere u nastavku i web-stranica postat će alat koji donosi kupce.'
area:
    speed: 'Brzina učitavanja'
    accessibility: 'Pristupačnost'
    seo: 'Vidljivost na Googleu'
    ai: 'Vidljivost u AI pretraživanju'
    content: 'Sadržaj i jasnoća'
    legal: 'Pravno i privatnost'
    mobile: 'Mobilni uređaji'
    unavailable: 'Ovaj put nije bilo moguće izmjeriti.'
measure:
    effort:
        small: 'mali trud'
        medium: 'srednji trud'
        large: 'velik trud'

# ---------------------------------------------------------------- brzina
speed:
    summary:
        good: 'Početna stranica na mobitelu je vidljiva nakon %lcp% s. To je brže od većine web-stranica.'
        ok: 'Početnoj stranici na mobitelu treba %lcp% s. Upotrebljivo, ali neki posjetitelji odu prije nego što se učita.'
        bad: 'Početnoj stranici na mobitelu treba %lcp% s. Mnogi posjetitelji odu prije nego što se išta pojavi.'
    meta: 'Performanse %perf% od 100 · LCP %lcp% s · CLS %cls%'
    kpi:
        lcp: 'Glavni sadržaj vidljiv (LCP)'
        lcp_note: 'granica 2,5 s'
        cls: 'Pomaci rasporeda (CLS)'
        cls_note: 'granica 0,1'
        tbt: 'Vrijeme blokiranja (TBT)'
        tbt_note: 'granica 200 ms'
        inp: 'Reakcija na dodir (INP)'
        inp_note: 'granica 200 ms'
        perf: 'Rezultat performansi'
        perf_note: 'od 100'
        bytes: 'Veličina stranice'
        bytes_note: 'granica 2 MB'
        requests: 'Zahtjevi'
        requests_note: 'granica 80'
    issue:
        lcp:
            title: 'Početna stranica sporo se učitava na mobitelima'
            text: 'Glavni sadržaj pojavljuje se nakon %lcp% sekundi. Google granicu postavlja na 2,5 sekunde, a posjetitelji sude i ranije.'
            fix: 'Smanjite najveću sliku u vidljivom dijelu, skripte učitavajte kasnije i neka poslužitelj šalje komprimirane datoteke. Obično jedan do dva sata rada.'
        largest_image:
            title: 'Jedna slika ima %kb% KB'
            text: 'Datoteka „%file%” najteži je element početne stranice i usporava sve što dolazi nakon nje.'
            fix: 'Izvezite sliku u prikazanoj širini (obično 1200–1600 px) kao WebP ili AVIF. Često 80 % manja bez vidljive razlike.'
        render_blocking:
            title: '%count% datoteka blokira prvi prikaz'
            text: 'Stilske datoteke ili skripte u zaglavlju stranice učitavaju se u cijelosti prije nego što se išta prikaže.'
            fix: 'Nekritični CSS i JavaScript učitavajte odgođeno ili asinkrono; u zaglavlju zadržite samo ključne stilove.'
        image_formats:
            title: 'Slike u zastarjelim formatima'
            text: 'JPEG/PNG ondje gdje bi WebP ili AVIF bili 30–70 % manji.'
            fix: 'Neka CMS automatski isporučuje moderne formate (većina sustava to radi jednom postavkom).'
        responsive_images:
            title: 'Slike veće nego što su prikazane'
            text: 'Mobiteli preuzimaju slike veličine za stolna računala i zatim ih smanjuju.'
            fix: 'Pripremite slike u više veličina (srcset); CMS ih obično može sam izraditi.'
        unused_js:
            title: 'Neiskorišteni JavaScript'
            text: 'Učitavaju se skripte koje ova stranica ne koristi. Troše vrijeme i bateriju.'
            fix: 'Uklonite nekorištene dodatke i skripte za praćenje; ostale učitavajte samo na stranicama koje ih trebaju.'
        ttfb:
            title: 'Poslužitelj sporo odgovara'
            text: 'Poslužitelju treba %value% da isporuči prvi bajt, prije nego što preglednik išta može učiniti.'
            fix: 'Uključite predmemoriju stranica u CMS-u ili zatražite brži paket od pružatelja hostinga.'
        compression:
            title: 'Datoteke se šalju nekomprimirane'
            text: 'Tekstne datoteke (HTML, CSS, JavaScript) ne komprimiraju se na putu do preglednika.'
            fix: 'Uključite gzip ili Brotli kompresiju na poslužitelju (jedan redak u konfiguraciji poslužitelja).'
        cls:
            title: 'Sadržaj skače tijekom učitavanja (CLS %cls%)'
            text: 'Elementi se pomiču nakon što su se pojavili pa posjetitelji kliknu na pogrešno mjesto ili izgube mjesto u tekstu.'
            fix: 'Rezervirajte prostor za slike, oglase i fontove (atributi width/height, font-display: swap).'
        bytes:
            title: 'Početna stranica ima %mb% MB'
            text: 'Na mobilnoj vezi to traje nekoliko sekundi i troši podatkovni promet.'
            fix: 'Komprimirajte slike i videozapise; videozapise učitavajte tek kad postanu vidljivi.'
        console:
            title: '%count% pogrešaka u konzoli preglednika'
            text: 'Pogreške u JavaScriptu upućuju na neispravne funkcije na koje posjetitelji mogu naići.'
            fix: 'Neka web-developer provjeri pogreške; obično su uzrok zastarjeli dodaci.'
    good:
        lcp:
            title: 'Brzo na mobitelima'
            text: 'Glavni sadržaj vidljiv je nakon %lcp% s — ispod 2,5 s koje Google očekuje. To je osnova koja mnogim web-stranicama nedostaje.'
        cls:
            title: 'Ništa ne skače'
            text: 'Raspored ostaje stabilan tijekom učitavanja; posjetitelji mogu odmah čitati i klikati.'
        https:
            title: 'HTTPS ispravno postavljen'
            text: 'Šifrirana veza s valjanim certifikatom; obični http preusmjerava na https.'
        console:
            title: 'Nema pogrešaka u pregledniku'
            text: 'Konzola preglednika je čista — nema neispravnih skripti.'
        images:
            title: 'Slike se isporučuju ispravno'
            text: 'Moderni formati i odgovarajuće veličine za mobitel i stolno računalo.'

# ---------------------------------------------------------------- pristupačnost
a11y:
    summary:
        good: 'Bez prepreka u automatskim testovima: tekstovi su čitljivi, kontrole su označene.'
        ok: 'Uglavnom u redu. %count% nalaza o kontrastu i nekoliko oznaka dijele je od najbolje ocjene.'
        bad: 'Više prepreka: %count% nalaza o kontrastu, nedostaju oznake ili opisi. To smeta i običnim posjetiteljima.'
    meta: 'Lighthouse pristupačnost %score% od 100 · %count% nalaza o kontrastu'
    issue:
        meta_viewport:
            title: 'Zumiranje je na mobitelima blokirano'
            text: 'Stranica sprječava povećavanje prstima. Slabovidne osobe ne mogu povećati tekst.'
            fix: 'Uklonite user-scalable=no i maximum-scale iz oznake viewport u zaglavlju stranice, jedan redak u predlošku.'
        color_contrast:
            title: 'Tekst s premalim kontrastom (%count%×)'
            text: 'Svijetli tekst na svijetloj pozadini ili taman na tamnoj teško se čita na suncu, a otprilike i svakom dvanaestom muškarcu (poremećaj raspoznavanja boja). Potrebno: 4,5:1.'
            fix: 'Malo potamnite boju teksta ili pozadine — obično jedna vrijednost boje u stilskoj datoteci, bez redizajna.'
        image_alt:
            title: '%count% slika bez opisa'
            text: 'Čitači zaslona i Google ne znaju što te slike prikazuju.'
            fix: 'Svakoj sadržajnoj slici dodajte kratak alternativni tekst (alt); ukrasne slike dobivaju prazan atribut alt.'
        link_name:
            title: '%count% poveznica bez čitljivog naziva'
            text: 'Poveznice poput „pročitaj više” ili poveznice samo s ikonom korisnicima čitača zaslona ne govore ništa.'
            fix: 'Svakoj poveznici dajte tekst koji kaže kamo vodi, ili aria-label za poveznice s ikonom.'
        button_name:
            title: '%count% gumba bez naziva'
            text: 'Gumbe s ikonom bez oznake korisnici čitača zaslona ne mogu koristiti.'
            fix: 'Svakom gumbu s ikonom dodajte aria-label (npr. „Otvori izbornik”).'
        html_has_lang:
            title: 'Jezik stranice nije naveden'
            text: 'Bez atributa jezika čitači zaslona biraju pogrešan izgovor.'
            fix: 'Postavite lang="hr" (ili svoj jezik) na element <html>.'
        heading_order:
            title: 'Naslovi preskaču razine'
            text: 'Razine naslova (h1 → h3) se preskaču pa je struktura zbunjujuća za pomoćne tehnologije.'
            fix: 'Razine naslova koristite redom; izgled oblikujte CSS-om umjesto da razinu birate prema izgledu.'
        label:
            title: '%count% polja obrasca bez oznake'
            text: 'Polja bez vidljive, povezane oznake teško se ispunjavaju, a automatsko popunjavanje preglednika ih odbacuje.'
            fix: 'Svakom polju dajte <label for> koji odgovara id-u polja.'
        target_size:
            title: '%count% premalih ciljeva za dodir'
            text: 'Poveznice ili gumbi manji od 24 px lako se promaše palcem.'
            fix: 'Povećajte površinu za klik (padding) na najmanje 44 × 44 px.'
        label_content_name_mismatch:
            title: '%count% kontrola čiji se izgovoreni naziv razlikuje od oznake'
            text: 'Gumbi s ikonom (pretraživanje, strelice, poziv) imaju pristupačni naziv koji ne odgovara vidljivom tekstu pa glasovno upravljanje i čitači zaslona najavljuju nešto drugo.'
            fix: 'Neka aria-label počinje vidljivim tekstom ili neka tekst ikone bude naziv.'
    good:
        contrast:
            title: 'Kontrasti su u redu'
            text: 'Svaki provjereni tekst postiže potreban omjer kontrasta.'
        images:
            title: 'Slike su opisane'
            text: 'Svih %count% slika na provjerenim stranicama ima alternativni tekst.'
        lang:
            title: 'Jezik je naveden'
            text: 'Čitači zaslona čitaju stranicu na pravom jeziku.'
        names:
            title: 'Poveznice i gumbi imaju nazive'
            text: 'Svaka kontrola ima čitljiv naziv; razine naslova su po redu.'
        targets:
            title: 'Ciljevi za dodir dovoljno veliki'
            text: 'Gumbi i poveznice mogu se pogoditi palcem.'

# ---------------------------------------------------------------- seo
seo:
    summary:
        good: 'Naslovi, opisi, podnaslovi i strukturirani podaci su uredni. Google može čitati stranicu.'
        ok: 'Osnove postoje; nekoliko naslova, opisa ili pojedinosti strukture vrijedi urediti.'
        bad: 'Nedostaju važne osnove za Google. Tražilice pronalaze stranicu, ali jedva znaju o čemu je riječ.'
    meta: 'Lighthouse SEO %score% od 100 · provjereno stranica: %pages%'
    issue:
        title_missing:
            title: 'Nema naslova stranice na %page%'
            text: 'Naslov je glavni redak u Googleovim rezultatima. Bez njega Google sam izmišlja naslov.'
            fix: 'Napišite naslov do 60 znakova: što nudite i gdje (npr. „Stomatolog u Zagrebu – dr. Primjer”).'
        title_long:
            title: 'Predug naslov stranice na %page%'
            text: '%length% znakova — Google skraćuje naslove nakon otprilike 60.'
            fix: 'Skratite naslov; najvažnije riječi stavite na početak.'
        desc_missing:
            title: 'Nema opisa na %page%'
            text: 'Meta opis je sivi tekst ispod rezultata na Googleu. Ako nedostaje, Google prikazuje nasumičan isječak.'
            fix: 'Napišite 140–158 znakova koji govore što stranica nudi i zašto bi netko kliknuo.'
        desc_long:
            title: 'Predug opis na %page%'
            text: '%length% znakova — Google skraćuje opise nakon otprilike 160.'
            fix: 'Skratite na 140–158 znakova.'
        h1_missing:
            title: 'Nema glavnog naslova na %page%'
            text: 'Svaka stranica treba točno jedan H1 koji imenuje temu.'
            fix: 'Najvažniji naslov postavite kao H1.'
        h1_multiple:
            title: '%count% glavnih naslova na %page%'
            text: 'Više naslova H1 zamagljuje o čemu je stranica.'
            fix: 'Zadržite jedan H1 po stranici; ostale pretvorite u H2.'
        noindex:
            title: 'Početna stranica blokirana za Google'
            text: 'Početna stranica nosi uputu „noindex”: Googleu se poručuje da je ne navodi.'
            fix: 'Uklonite postavku noindex u CMS-u (obično kućica na stranici).'
        heading_skips:
            title: 'Preskočene razine naslova (%count%×)'
            text: 'Skokovi poput H1 → H3 čine strukturu nejasnom za Google i čitače zaslona.'
            fix: 'Razine naslova koristite redom.'
        sitemap_missing:
            title: 'Karta web-stranice nije pronađena'
            text: 'Datoteka sitemap.xml Googleu odjednom javlja sve stranice; bez nje nove stranice pronalazi kasnije.'
            fix: 'Uključite kartu web-stranice (sitemap) u CMS-u i navedite je u robots.txt.'
        schema:
            title: 'Nema strukturiranih podataka'
            text: 'Strukturirani podaci (schema.org) govore Googleu i AI asistentima o kakvom je poslovanju riječ, gdje se nalazi i kada radi.'
            fix: 'Dodajte podatke Organization ili LocalBusiness s nazivom, adresom, telefonom i radnim vremenom (većina CMS-ova ima dodatak za to).'
        not_crawlable:
            title: 'Stranica blokirana za tražilice'
            text: 'Upute za robote sprječavaju Google da indeksira stranicu.'
            fix: 'Provjerite robots.txt i meta oznaku robots; uklonite blokadu za javne stranice.'
        link_text:
            title: '%count% poveznica s besmislenim tekstom'
            text: '„Kliknite ovdje” ili „više” Googleu ne govori ništa o ciljnoj stranici.'
            fix: 'Koristite opisne tekstove poveznica („naše radno vrijeme”).'
        crawlable_anchors:
            title: 'Poveznice koje Google ne može slijediti'
            text: 'Neke su poveznice izrađene samo JavaScriptom i nevidljive su tražilicama.'
            fix: 'Za navigaciju koristite obične poveznice <a href>.'
        canonical:
            title: 'Kanonska poveznica je neispravna'
            text: 'Oznaka canonical upućuje na pogrešnu ili nedostupnu adresu, što može zbuniti Google.'
            fix: 'Neka kanonska poveznica upućuje na samu stranicu.'
        hreflang:
            title: 'Jezične poveznice su neispravne'
            text: 'Oznake hreflang za jezične inačice sadrže pogreške.'
            fix: 'Neka se oznake hreflang isprave (valjani jezični kodovi, sve inačice upućuju jedna na drugu).'
        http_redirect:
            title: 'http ne preusmjerava na https'
            text: 'Posjetitelji koji upišu adresu bez https dolaze na nešifriranu inačicu.'
            fix: 'Dodajte trajno preusmjeravanje s http na https na poslužitelju.'
    good:
        sitemap:
            title: 'Karta web-stranice postoji'
            text: 'Za Google je navedeno stranica: %count%.'
        titles:
            title: 'Naslovi i opisi postavljeni'
            text: 'Svaka provjerena stranica ima vlastiti naslov i opis odgovarajuće duljine.'
        h1:
            title: 'Jedan glavni naslov po stranici'
            text: 'Jasna struktura za Google i posjetitelje.'
        schema:
            title: 'Strukturirani podaci postoje'
            text: 'Google i AI asistenti pronalaze podatke vrste %types%.'
        https:
            title: 'Šifrirano i preusmjereno'
            text: 'https s preusmjeravanjem s http.'

# ---------------------------------------------------------------- vidljivost u AI-ju
ai:
    summary:
        good: 'AI asistenti mogu čitati i razumjeti stranicu; sažetak (llms.txt) postoji.'
        ok: 'AI asistenti smiju čitati stranicu, ali sami moraju sklapati što nudite.'
        bad: 'AI tražilice jedva vide stranicu: nema sažetka, pretraživači su blokirani ili nema prepoznatljivih podataka o poslovanju.'
    meta: 'llms.txt: %llms% · blokirano AI pretraživača: %blocked%'
    issue:
        llms_missing:
            title: 'Nema datoteke llms.txt'
            text: 'ChatGPT, Perplexity i Googleov AI traže kratku tekstnu datoteku koja kaže čime se poslovanje bavi, za koga i gdje. Bez nje pogađaju na temelju stranica.'
            fix: 'Izradite /llms.txt: tri odlomka (ponuda, ciljna skupina, lokacija/kontakt) i poveznice na ključne stranice. Pola sata rada.'
        bots_blocked:
            title: 'Blokirani AI pretraživači: %bots%'
            text: 'robots.txt tim asistentima zabranjuje čitanje stranice pa je ne mogu preporučiti.'
            fix: 'Dopustite pretraživače u robots.txt — ili svjesno odlučite ostati izvan AI odgovora.'
        no_identity_schema:
            title: 'Poslovanje nije strojno čitljivo'
            text: 'Bez podataka Organization/LocalBusiness asistent ne zna pouzdano naziv, adresu ni radno vrijeme.'
            fix: 'Dodajte strukturirane podatke s nazivom, adresom, telefonom, radnim vremenom i područjem poslovanja.'
        offer_unclear:
            title: 'Ponuda nije u prvim rečenicama'
            text: 'AI odgovori citiraju prve rečenice stranice. Na početnoj stranici one ne navode jasno ponudu.'
            fix: 'Započnite stranicu jednom jednostavnom rečenicom: tko ste, čime se bavite, za koga i gdje.'
    good:
        llms:
            title: 'llms.txt postoji'
            text: 'AI asistenti dobivaju sažetak izravno od vas.'
        bots:
            title: 'AI pretraživači su dopušteni'
            text: 'GPTBot, ClaudeBot, PerplexityBot i Google-Extended smiju čitati stranicu.'
        schema:
            title: 'Poslovanje je strojno čitljivo'
            text: 'Strukturirani podaci vrste %types% identificiraju poslovanje.'
        offer:
            title: 'Ponuda je navedena rano'
            text: 'Već prve rečenice govore čime se poslovanje bavi.'

# ---------------------------------------------------------------- sadržaj
content:
    summary:
        good: 'Unutar pet sekundi jasno je čime se poslovanje bavi, za koga i koji je sljedeći korak.'
        ok: 'Razumljivo, ali ponuda ili sljedeći korak mogli bi biti jasniji; neki pojmovi pretpostavljaju predznanje.'
        bad: 'Posjetitelji ne shvaćaju brzo što se nudi ni kako stupiti u kontakt. To vas stoji upita.'
    meta:
        ai: 'AI je pročitao stranice (%pages%) kao posjetitelj koji je prvi put tu'
        heuristic: 'Heuristička provjera (AI nije konfiguriran)'
    issue:
        no_cta:
            title: 'Nema jasnog sljedećeg koraka'
            text: 'Zainteresirani posjetitelji na prvi pogled ne vide kako nazvati, poslati upit ili rezervirati.'
            fix: 'Na prvi zaslon stavite jednu istaknutu radnju: „Nazovite”, „Zatražite ponudu” ili „Rezervirajte” — s brojem telefona.'
        thin:
            title: 'Vrlo malo teksta (riječi: %words%)'
            text: 'Uz tako malo teksta ni posjetitelji ni Google ne saznaju što nudite.'
            fix: 'Opišite ponudu, ciljnu skupinu i lokaciju u dva ili tri kratka odlomka.'
        phone:
            title: 'Broj telefona nije moguće dodirnuti'
            text: 'Na mobitelima broj bi trebao biti dodirljiv (poveznica tel:). Ovdje nedostaje ili je običan tekst.'
            fix: 'Povežite broj telefona s tel:+385…; stavite ga u zaglavlje ili podnožje svake stranice.'
    good:
        cta:
            title: 'Jasan sljedeći korak'
            text: 'Posjetitelji vide kako stupiti u kontakt.'
        length:
            title: 'Dovoljno teksta'
            text: 'Ponudu opisuje riječi: %words%.'
        phone:
            title: 'Broj telefona je dodirljiv'
            text: 'Jedan dodir na mobitelu pokreće poziv.'

# ---------------------------------------------------------------- pravno
legal:
    summary:
        good: 'Impresum, pravila privatnosti i upravljanje privolama postoje, koliko se to tehnički može provjeriti.'
        ok: 'Impresum i pravila privatnosti postoje; način rada s uslugama trećih strana trebalo bi provjeriti.'
        bad: 'Nedostaje impresum ili pravila privatnosti, ili se usluge praćenja učitavaju prije privole. Provjerite to sa svojim pravnim savjetnikom.'
    meta: 'Tehnička provjera, ne pravni savjet'
    note: 'Ovo je tehnička provjera: traži stranice i usluge koje se učitavaju prije bilo kakve privole. Nije pravni savjet — pojedinosti neka provjeri vaš pravni savjetnik.'
    issue:
        imprint:
            title: 'Impresum (pravne informacije) nije pronađen'
            text: 'Na provjerenim stranicama nije pronađena poveznica na impresum ili je stranica nedostupna.'
            fix: 'Postavite poveznicu na impresum sa svake stranice (podnožje), s obaveznim podacima.'
        privacy:
            title: 'Pravila privatnosti nisu pronađena'
            text: 'Nije pronađena poveznica na pravila privatnosti ili je stranica nedostupna.'
            fix: 'Postavite poveznicu na pravila privatnosti sa svake stranice (podnožje); u njima mora biti navedena svaka korištena usluga.'
        tracking:
            title: 'Praćenje prije privole: %services%'
            text: 'Ove se usluge učitavaju pri prvom posjetu, prije nego što je posjetitelj mogao dati privolu. Prema GDPR-u i pravilima o kolačićima za to je potrebna prethodna privola.'
            fix: 'Učitavajte ove usluge tek nakon privole u traci za kolačiće (ili podesite alat za privole da ih blokira).'
        embeds:
