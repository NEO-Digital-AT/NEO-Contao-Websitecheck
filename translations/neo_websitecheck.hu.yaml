# NEO Website Check — Hungarian texts (front end, report, e-mail).
# Copy to translations/neo_websitecheck.hu.yaml in your project to override single keys.
word:
    yes: 'igen'
    no: 'nem'
    none: 'nincs'
grade:
    1: 'Kiváló'
    2: 'Jó'
    3: 'Közepes'
    4: 'Elégséges'
    5: 'Elégtelen'
verdict:
    good: 'Megbízható weboldal. Semmi sürgős, néhány apróság még jobbá tenné.'
    mid: 'Szilárd alap, de néhány pont valószínűleg megrendelésektől fosztja meg Önt. A legfontosabbakat alább találja.'
    low: 'Egyértelműen cselekedni kell. Kezdje az alábbi három teendővel, és a weboldal ügyfeleket hozó eszközzé válik.'
area:
    speed: 'Betöltési sebesség'
    accessibility: 'Akadálymentesség'
    seo: 'Megtalálhatóság a Google-ben'
    ai: 'Láthatóság az MI-keresőkben'
    content: 'Tartalom és érthetőség'
    legal: 'Jogi kérdések és adatvédelem'
    mobile: 'Mobil'
    unavailable: 'Ezúttal nem sikerült mérni.'
measure:
    effort:
        small: 'kis ráfordítás'
        medium: 'közepes ráfordítás'
        large: 'nagy ráfordítás'

# ---------------------------------------------------------------- speed
speed:
    summary:
        good: 'A kezdőlap telefonon %lcp% mp után látható. Ez gyorsabb, mint a legtöbb weboldal.'
        ok: 'A kezdőlap telefonon %lcp% mp alatt töltődik be. Használható, de néhány látogató távozik, mielőtt elkészülne.'
        bad: 'A kezdőlapnak telefonon %lcp% mp kell. Sok látogató elmegy, mielőtt bármi megjelenne.'
    meta: 'Teljesítmény: %perf%/100 · LCP %lcp% mp · CLS %cls%'
    kpi:
        lcp: 'Fő tartalom látható (LCP)'
        lcp_note: 'határérték 2,5 mp'
        cls: 'Elrendezés-elmozdulások (CLS)'
        cls_note: 'határérték 0,1'
        tbt: 'Blokkolt idő (TBT)'
        tbt_note: 'határérték 200 ms'
        inp: 'Reakció érintésre (INP)'
        inp_note: 'határérték 200 ms'
        perf: 'Teljesítménypontszám'
        perf_note: '100-ból'
        bytes: 'Oldal mérete'
        bytes_note: 'határérték 2 MB'
        requests: 'Kérések'
        requests_note: 'határérték 80'
    issue:
        lcp:
            title: 'A kezdőlap lassan töltődik be telefonon'
            text: 'A fő tartalom %lcp% másodperc után jelenik meg. A Google 2,5 másodpercnél húzza meg a határt, a látogatók még hamarabb ítélnek.'
            fix: 'Kicsinyítse le a legnagyobb képet a látható felső részen, töltse be később a szkripteket, és a szerver tömörített fájlokat küldjön. Általában egy-két óra munka.'
        largest_image:
            title: 'Egy kép mérete %kb% KB'
            text: 'A(z) „%file%” fájl a kezdőlap legnehezebb eleme, és mindent késleltet, ami utána jön.'
            fix: 'Exportálja a képet a megjelenített szélességben (általában 1200–1600 px) WebP vagy AVIF formátumban. Gyakran 80 százalékkal kisebb, látható különbség nélkül.'
        render_blocking:
            title: '%count% fájl blokkolja az első megjelenítést'
            text: 'Az oldal fejlécében lévő stíluslapok vagy szkriptek teljesen betöltődnek, mielőtt bármi megjelenne.'
            fix: 'A nem kritikus CSS-t és JavaScriptet töltse be késleltetve vagy aszinkron módon; a fejlécben csak a kritikus stílusok maradjanak.'
        image_formats:
            title: 'Képek régi formátumban'
            text: 'JPEG/PNG ott, ahol a WebP vagy az AVIF 30–70 százalékkal kisebb lenne.'
            fix: 'A tartalomkezelő rendszer szolgáltassa automatikusan a modern formátumokat (a legtöbb rendszer egyetlen beállítással megteszi).'
        responsive_images:
            title: 'A képek nagyobbak a megjelenítettnél'
            text: 'A telefonok asztali méretű képeket töltenek le, majd lekicsinyítik őket.'
            fix: 'Biztosítson több méretben képeket (srcset); a tartalomkezelő rendszer ezeket általában el tudja készíteni.'
        unused_js:
            title: 'Fel nem használt JavaScript'
            text: 'Olyan szkriptek töltődnek be, amelyeket ez az oldal nem használ. Időbe és akkumulátorba kerülnek.'
            fix: 'Távolítsa el a nem használt bővítményeket és követőkódokat; a többit csak azokon az oldalakon töltse be, ahol szükség van rájuk.'
        ttfb:
            title: 'A szerver lassan válaszol'
            text: 'A szervernek %value% kell az első bájt elküldéséhez, mielőtt a böngésző bármit tehetne.'
            fix: 'Kapcsolja be az oldal-gyorsítótárat a tartalomkezelőben, vagy kérjen gyorsabb csomagot a tárhelyszolgáltatótól.'
        compression:
            title: 'A fájlok tömörítés nélkül érkeznek'
            text: 'A szöveges fájlok (HTML, CSS, JavaScript) tömörítetlenül jutnak el a böngészőig.'
            fix: 'Kapcsolja be a gzip- vagy Brotli-tömörítést a szerveren (egy sor a szerver konfigurációjában).'
        cls:
            title: 'A tartalom ugrál betöltés közben (CLS %cls%)'
            text: 'Az elemek megjelenésük után elmozdulnak, így a látogatók rossz helyre kattintanak, vagy elveszítik, hol tartottak.'
            fix: 'Foglaljon helyet a képeknek, hirdetéseknek és betűtípusoknak (width/height attribútumok, font-display: swap).'
        bytes:
            title: 'A kezdőlap mérete %mb% MB'
            text: 'Mobilkapcsolaton ez több másodpercig tart, és fogyasztja az adatkeretet.'
            fix: 'Tömörítse a képeket és videókat; a videókat csak akkor töltse be, amikor láthatóvá válnak.'
        console:
            title: '%count% hiba a böngészőkonzolban'
            text: 'A JavaScript-hibák hibás funkciókra utalnak, amelyekbe a látogatók belefuthatnak.'
            fix: 'Ellenőriztesse a hibákat a webfejlesztővel; általában elavult bővítmények okozzák.'
    good:
        lcp:
            title: 'Gyors telefonon'
            text: 'A fő tartalom %lcp% mp után látható — a Google által elvárt 2,5 mp alatt. Ez az az alap, ami sok weboldalnál hiányzik.'
        cls:
            title: 'Semmi sem ugrál'
            text: 'Az elrendezés betöltés közben stabil marad; a látogatók azonnal olvashatnak és kattinthatnak.'
        https:
            title: 'A HTTPS helyesen be van állítva'
            text: 'Titkosított kapcsolat érvényes tanúsítvánnyal; a sima http átirányít a https-re.'
        console:
            title: 'Nincs hiba a böngészőben'
            text: 'A böngészőkonzol tiszta — nincsenek hibás szkriptek.'
        images:
            title: 'A képek megfelelően érkeznek'
            text: 'Modern formátumok és a telefonhoz, illetve asztali géphez illő méretek.'

# ---------------------------------------------------------------- accessibility
a11y:
    summary:
        good: 'Az automatikus tesztek szerint akadálymentes: a szövegek olvashatók, a kezelőelemek fel vannak címkézve.'
        ok: 'Nagyrészt rendben van. %count% kontraszthiba és néhány hiányzó felirat választja el a legjobb osztályzattól.'
        bad: 'Több akadály: %count% kontraszthiba, hiányzó feliratok vagy leírások. Ezek a többi látogatót is zavarják.'
    meta: 'Lighthouse akadálymentesség: %score%/100 · %count% kontraszthiba'
    issue:
        meta_viewport:
            title: 'A nagyítás tiltva van telefonon'
            text: 'Az oldal megakadályozza a két ujjal történő nagyítást. A gyengénlátók nem tudják felnagyítani a szöveget.'
            fix: 'Távolítsa el a user-scalable=no és a maximum-scale beállítást az oldal fejlécében lévő viewport címkéből – egy sor a sablonban.'
        color_contrast:
            title: 'Túl kevés kontrasztú szöveg (%count%×)'
            text: 'A világos háttéren lévő világos vagy a sötéten lévő sötét szöveg napfényben nehezen olvasható, és nagyjából minden tizenkettedik férfi számára is (színlátási zavar). Előírás: 4,5:1.'
            fix: 'Sötétítse kissé a szöveg vagy a háttér színét — általában egyetlen színérték a stíluslapban, újratervezés nélkül.'
        image_alt:
            title: '%count% kép leírás nélkül'
            text: 'A képernyőolvasók és a Google nem tudják, mit ábrázolnak ezek a képek.'
            fix: 'Adjon rövid alternatív szöveget (alt) minden tartalmi képhez; a díszítő képek üres alt attribútumot kapnak.'
        link_name:
            title: '%count% hivatkozás olvasható név nélkül'
            text: 'A „tovább” típusú vagy csak ikonból álló hivatkozások semmit sem mondanak a képernyőolvasót használóknak.'
            fix: 'Adjon minden hivatkozásnak olyan szöveget, amely megmondja, hová vezet, az ikonos hivatkozásoknak pedig aria-label-t.'
        button_name:
            title: '%count% gomb név nélkül'
            text: 'A felirat nélküli ikongombokat a képernyőolvasót használók nem tudják kezelni.'
            fix: 'Adjon aria-label-t minden ikongombhoz (pl. „Menü megnyitása”).'
        html_has_lang:
            title: 'Az oldal nyelve nincs megadva'
            text: 'Nyelvi attribútum nélkül a képernyőolvasók rossz kiejtést választanak.'
            fix: 'Állítsa be a lang="hu" (vagy az Ön nyelvének) attribútumot a <html> elemen.'
        heading_order:
            title: 'A címsorok szinteket ugranak át'
            text: 'A címsorszintek (h1 → h3) kimaradnak, így a szerkezet zavaros a segítő technológiák számára.'
            fix: 'A címsorszinteket sorrendben használja; a megjelenést CSS-sel alakítsa, ne a szint megválasztásával.'
        label:
            title: '%count% űrlapmező felirat nélkül'
            text: 'A látható, hozzárendelt felirat nélküli mezőket nehéz kitölteni, és a böngészők automatikus kitöltése sem ismeri fel őket.'
            fix: 'Adjon minden mezőhöz egy <label for> elemet, amely egyezik a mező azonosítójával (id).'
        target_size:
            title: '%count% túl kicsi érintési felület'
            text: 'A 24 px-nél kisebb hivatkozásokat vagy gombokat hüvelykujjal könnyű elvéteni.'
            fix: 'Növelje a kattintható felületet (padding) legalább 44 × 44 px-re.'
        label_content_name_mismatch:
            title: '%count% kezelőelem, amelynek kimondott neve eltér a feliratától'
            text: 'Az ikongombok (keresés, nyilak, hívás) olyan akadálymentes nevet viselnek, amely nem egyezik a látható szöveggel, így a hangvezérlés és a képernyőolvasók mást mondanak be.'
            fix: 'Az aria-label a látható szöveggel kezdődjön, vagy az ikon szövege legyen a név.'
    good:
        contrast:
            title: 'A kontrasztok rendben vannak'
            text: 'Minden ellenőrzött szöveg eléri az előírt kontrasztarányt.'
        images:
            title: 'A képek le vannak írva'
            text: 'Az ellenőrzött oldalak mind a(z) %count% képének van alternatív szövege.'
        lang:
            title: 'A nyelv meg van adva'
            text: 'A képernyőolvasók a megfelelő nyelven olvassák fel az oldalt.'
        names:
            title: 'A hivatkozásoknak és gomboknak van nevük'
            text: 'Minden kezelőelemnek olvasható neve van; a címsorszintek sorrendben vannak.'
        targets:
            title: 'Elég nagyok az érintési felületek'
            text: 'A gombok és hivatkozások hüvelykujjal is eltalálhatók.'

# ---------------------------------------------------------------- seo
seo:
    summary:
        good: 'A címek, leírások, címsorok és strukturált adatok rendben vannak. A Google tudja olvasni az oldalt.'
        ok: 'Az alapok megvannak; néhány címet, leírást vagy szerkezeti részletet érdemes rendbe tenni.'
        bad: 'Fontos alapok hiányoznak a Google számára. A keresők megtalálják az oldalt, de alig tudják, miről szól.'
    meta: 'Lighthouse SEO: %score%/100 · %pages% ellenőrzött oldal'
    issue:
        title_missing:
            title: 'Nincs oldalcím: %page%'
            text: 'A cím a Google-találat főcíme. Ha hiányzik, a Google kitalál egyet.'
            fix: 'Írjon legfeljebb 60 karakteres címet: mit kínál és hol (pl. „Fogorvos Győrben – Dr. Minta”).'
        title_long:
            title: 'Túl hosszú oldalcím: %page%'
            text: '%length% karakter — a Google kb. 60 karakter után levágja a címeket.'
            fix: 'Rövidítse le a címet; a legfontosabb szavak kerüljenek előre.'
        desc_missing:
            title: 'Nincs leírás: %page%'
            text: 'A metaleírás a Google-találat alatti szürke szöveg. Ha hiányzik, a Google egy véletlenszerű részletet mutat.'
            fix: 'Írjon 140–158 karaktert arról, mit kínál az oldal, és miért érdemes rákattintani.'
        desc_long:
            title: 'Túl hosszú leírás: %page%'
            text: '%length% karakter — a Google kb. 160 karakter után levágja a leírásokat.'
            fix: 'Rövidítse 140–158 karakterre.'
        h1_missing:
            title: 'Nincs főcím: %page%'
            text: 'Minden oldalnak pontosan egy H1 kell, amely megnevezi a témát.'
            fix: 'A legfontosabb címsor legyen H1.'
        h1_multiple:
            title: '%count% főcím ezen az oldalon: %page%'
            text: 'Több H1 címsor elmossa, miről szól az oldal.'
            fix: 'Oldalanként egy H1 maradjon; a többi legyen H2.'
        noindex:
            title: 'A kezdőlap le van tiltva a Google elől'
            text: 'A kezdőlapon „noindex” utasítás van: a Google azt az utasítást kapja, hogy ne jelenítse meg.'
            fix: 'Távolítsa el a noindex beállítást a tartalomkezelőben (általában egy jelölőnégyzet az oldalnál).'
        heading_skips:
            title: 'Átugrott címsorszintek (%count%×)'
            text: 'Az olyan ugrások, mint a H1 → H3, a Google és a képernyőolvasók számára is áttekinthetetlenné teszik a szerkezetet.'
            fix: 'A címsorszinteket sorrendben használja.'
        sitemap_missing:
            title: 'Nem található webhelytérkép'
            text: 'A sitemap.xml egyszerre megmutatja a Google-nek az összes oldalt; nélküle az új oldalakat később találja meg.'
            fix: 'Kapcsolja be a webhelytérképet a tartalomkezelőben, és hivatkozzon rá a robots.txt fájlban.'
        schema:
            title: 'Nincsenek strukturált adatok'
            text: 'A strukturált adatok (schema.org) megmondják a Google-nek és az MI-asszisztenseknek, milyen vállalkozásról van szó, hol található és mikor van nyitva.'
            fix: 'Adjon hozzá Organization vagy LocalBusiness adatokat névvel, címmel, telefonszámmal és nyitvatartással (a legtöbb tartalomkezelőhöz van rá bővítmény).'
        not_crawlable:
            title: 'Az oldal le van tiltva a keresők elől'
            text: 'Robots-utasítások akadályozzák meg, hogy a Google indexelje az oldalt.'
            fix: 'Ellenőrizze a robots.txt fájlt és a robots metacímkét; a nyilvános oldalaknál szüntesse meg a tiltást.'
        link_text:
            title: '%count% hivatkozás semmitmondó szöveggel'
            text: 'A „Kattintson ide” vagy a „tovább” semmit sem árul el a Google-nek a céloldalról.'
            fix: 'Használjon beszédes hivatkozásszövegeket („nyitvatartásunk”).'
        crawlable_anchors:
            title: 'Hivatkozások, amelyeket a Google nem tud követni'
            text: 'Egyes hivatkozások csak JavaScripttel készülnek, és a keresők számára láthatatlanok.'
            fix: 'A navigációhoz normál <a href> hivatkozásokat használjon.'
        canonical:
            title: 'Hibás canonical hivatkozás'
            text: 'A canonical címke rossz vagy elérhetetlen címre mutat, ami megzavarhatja a Google-t.'
            fix: 'A canonical hivatkozás magára az oldalra mutasson.'
        hreflang:
            title: 'Hibás nyelvi hivatkozások'
            text: 'A nyelvi változatokhoz tartozó hreflang címkék hibákat tartalmaznak.'
            fix: 'Javíttassa ki a hreflang címkéket (érvényes nyelvkódok, minden változat hivatkozik a többire).'
        http_redirect:
            title: 'A http nem irányít át a https-re'
            text: 'Aki https nélkül írja be a címet, a titkosítatlan változatra érkezik.'
            fix: 'Állítson be a szerveren végleges átirányítást a http-ről a https-re.'
    good:
        sitemap:
            title: 'Van webhelytérkép'
            text: '%count% oldal szerepel benne a Google számára.'
        titles:
            title: 'A címek és leírások megvannak'
            text: 'Minden ellenőrzött oldalnak saját, megfelelő hosszúságú címe és leírása van.'
        h1:
            title: 'Oldalanként egy főcím'
            text: 'Világos szerkezet a Google és a látogatók számára.'
        schema:
            title: 'Vannak strukturált adatok'
            text: 'A Google és az MI-asszisztensek ilyen adatokat találnak: %types%.'
        https:
            title: 'Titkosítva és átirányítva'
            text: 'https, átirányítással a http-ről.'

# ---------------------------------------------------------------- AI visibility
ai:
    summary:
        good: 'Az MI-asszisztensek el tudják olvasni és meg tudják érteni az oldalt; van összefoglaló (llms.txt).'
        ok: 'Az MI-asszisztensek olvashatják az oldalt, de maguknak kell összerakniuk, mit kínál Ön.'
        bad: 'Az MI-keresők alig látják az oldalt: nincs összefoglaló, a robotok le vannak tiltva, vagy nincsenek azonosítható cégadatok.'
    meta: 'llms.txt: %llms% · %blocked% letiltott MI-robot'
    issue:
        llms_missing:
            title: 'Nincs llms.txt'
            text: 'A ChatGPT, a Perplexity és a Google MI-je egy rövid szövegfájlt keres, amely megmondja, mivel foglalkozik a vállalkozás, kinek és hol. Ha nincs, az oldalak alapján találgatnak.'
            fix: 'Hozza létre a /llms.txt fájlt: három bekezdés (kínálat, célcsoport, hely/elérhetőség), valamint hivatkozások a legfontosabb oldalakra. Félórás munka.'
        bots_blocked:
            title: 'Letiltott MI-robotok: %bots%'
            text: 'A robots.txt megtiltja ezeknek az asszisztenseknek az oldal olvasását, így nem is tudják ajánlani.'
            fix: 'Engedélyezze a robotokat a robots.txt fájlban — vagy döntsön tudatosan amellett, hogy kimarad az MI-válaszokból.'
        no_identity_schema:
            title: 'A vállalkozás adatai nem géppel olvashatók'
            text: 'Organization/LocalBusiness adatok nélkül egy asszisztens nem ismeri megbízhatóan a nevet, a címet vagy a nyitvatartást.'
            fix: 'Adjon hozzá strukturált adatokat névvel, címmel, telefonszámmal, nyitvatartással és a kiszolgált területtel.'
        offer_unclear:
            title: 'A kínálat nem szerepel az első mondatokban'
            text: 'Az MI-válaszok egy oldal első mondatait idézik. A kezdőlapon ezek nem mondják ki világosan, mit kínál Ön.'
            fix: 'Kezdje az oldalt egy egyszerű mondattal: kik Önök, mit csinálnak, kinek és hol.'
    good:
        llms:
            title: 'Van llms.txt'
            text: 'Az MI-asszisztensek közvetlenül Öntől kapnak összefoglalót.'
        bots:
            title: 'Az MI-robotok engedélyezve'
            text: 'A GPTBot, a ClaudeBot, a PerplexityBot és a Google-Extended olvashatja az oldalt.'
        schema:
            title: 'A vállalkozás adatai géppel olvashatók'
            text: 'Strukturált adatok azonosítják a vállalkozást (típus: %types%).'
        offer:
            title: 'A kínálat már az elején szerepel'
            text: 'Már az első mondatok megmondják, mivel foglalkozik a vállalkozás.'

# ---------------------------------------------------------------- content
content:
    summary:
        good: 'Öt másodpercen belül világos, mivel foglalkozik a vállalkozás, kinek, és mi a következő lépés.'
        ok: 'Érthető, de a kínálat vagy a következő lépés lehetne világosabb; néhány kifejezés előismereteket feltételez.'
        bad: 'A látogatók nem értik meg gyorsan, mit kínálnak, és hogyan vehetik fel a kapcsolatot. Ez megkeresésekbe kerül.'
    meta:
        ai: 'Az MI úgy olvasott el %pages% oldalt, mint egy első látogató'
        heuristic: 'Szabályalapú ellenőrzés (nincs beállítva MI)'
    issue:
        no_cta:
            title: 'Nincs egyértelmű következő lépés'
