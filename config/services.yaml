services:
    _defaults:
        autowire: true
        autoconfigure: true

    Neo\WebsitecheckBundle\:
        resource: ../src/
        exclude:
            - ../src/DependencyInjection/
            - ../src/ContaoManager/
            - ../src/NeoWebsitecheckBundle.php
            - ../src/Check/Result/
            - ../src/Lang.php

    # Processed bundle configuration as a typed value object.
    Neo\WebsitecheckBundle\Settings:
        arguments:
            $config: '%neo_websitecheck.config%'
            $projectDir: '%kernel.project_dir%'
            $db: '@Neo\WebsitecheckBundle\Check\SettingsRepository'
            # Optional: the NEO Brevo module's API key (back end). Absent → Contao newsletter module.
            $brevoKeys: '@?Neo\BrevoNewsletterBundle\Brevo\ApiKeyResolver'

    # Dedicated HTTP clients. Slow small-business servers exist (one tested start
    # page needed 21 s): wait up to 35 s, the slowness then shows in the report.
    neo_websitecheck.site_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            - { timeout: 30, max_duration: 35, max_redirects: 5 }

    neo_websitecheck.api_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            - { timeout: 60, max_duration: 170 }

    Neo\WebsitecheckBundle\Check\SiteFetcher:
        arguments:
            $httpClient: '@neo_websitecheck.site_client'

    Neo\WebsitecheckBundle\Check\PageSpeedClient:
        arguments:
            $httpClient: '@neo_websitecheck.api_client'

    Neo\WebsitecheckBundle\Check\AiReviewer:
        arguments:
            $httpClient: '@neo_websitecheck.api_client'

    Neo\WebsitecheckBundle\Report\PdfGenerator:
        arguments:
            $httpClient: '@neo_websitecheck.api_client'

    Neo\WebsitecheckBundle\Newsletter\BrevoSubscriber:
        arguments:
            $httpClient: '@neo_websitecheck.api_client'

    # Contao's own double opt-in (tl_newsletter_recipients + contao.opt_in); only
    # used when the Contao newsletter module is installed.
    Neo\WebsitecheckBundle\Newsletter\ContaoSubscriber:
        arguments:
            $optIn: '@?contao.opt_in'
            $tokens: '@?contao.string.simple_token_parser'

    # Live Brevo lists/templates for the newsletter fields of a configuration (DCA callbacks).
    Neo\WebsitecheckBundle\Newsletter\BrevoOptions:
        public: true
        arguments:
            $httpClient: '@neo_websitecheck.api_client'
            $cache: '@cache.app'

    # ALTCHA is optional: Contao provides the service from 5.7 on; older
    # versions fall back to honeypot + minimum fill time (+ the IP limit).
    Neo\WebsitecheckBundle\Controller\Api\CheckController:
        arguments:
            $altcha: '@?contao.altcha'
        public: true

    Neo\WebsitecheckBundle\Controller\ContentElement\WebsitecheckController:
        arguments:
            $altcha: '@?contao.altcha'

    # Public: the back-end "resend" operation and DCA callbacks resolve them from the container.
    Neo\WebsitecheckBundle\Check\CheckRepository:
        public: true

    Neo\WebsitecheckBundle\Mail\ReportMailer:
        public: true

    Neo\WebsitecheckBundle\Backend\ResendOperation:
        public: true

    # DCA callbacks and key= operations are resolved by class name from the container.
    Neo\WebsitecheckBundle\Backend\SettingsCallbacks:
        public: true

    Neo\WebsitecheckBundle\Backend\PreviewOperation:
        public: true

    Neo\WebsitecheckBundle\Backend\DesignerOperation:
        public: true

    Neo\WebsitecheckBundle\Backend\ContentCallbacks:
        public: true

    # Fetched by the widget through the container (no DI for Contao widgets).
    Neo\WebsitecheckBundle\Design\BlockRegistry:
        public: true

    Neo\WebsitecheckBundle\Design\Presets:
        public: true

    # Instantiated by Contao (BE_FFL), fetches its services from the container itself.
    Neo\WebsitecheckBundle\Widget\DesignerWidget:
        autowire: false
        autoconfigure: false

    Neo\WebsitecheckBundle\Text\TextProvider:
        public: true

    # Languages without a translation file: the AI translates the visitor-facing
    # texts once (AiCatalogue); the decorator serves them for this bundle's
    # domain only. Project translation files always win.
    Neo\WebsitecheckBundle\I18n\AiCatalogue:
        public: true
        arguments:
            $httpClient: '@neo_websitecheck.api_client'

    Neo\WebsitecheckBundle\I18n\TranslatorDecorator:
        decorates: translator
        arguments:
            $inner: '@.inner'
            $catalogue: '@Neo\WebsitecheckBundle\I18n\AiCatalogue'

    Neo\WebsitecheckBundle\Command\TranslateCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
